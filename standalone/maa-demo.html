<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Maa Pharmacy Supply</title>
  <style>
:root {
  --bg: #f5f7f7;
  --surface: #ffffff;
  --text: #15201f;
  --muted: #5d6b6a;
  --line: #dde4e3;
  --brand: #0f766e;
  --brand-ink: #ffffff;
  --brand-soft: #e2f3f1;
  --danger: #b42318;
  --warn: #b54708;
  --ok: #067647;
  --radius: 10px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1514; --surface: #172120; --text: #e6eeed; --muted: #95a6a4; --line: #2a3735;
    --brand: #2bb3a6; --brand-ink: #062522; --brand-soft: #173a37; --danger: #f97066; --warn: #fdb022; --ok: #47cd89;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; }
a { color: var(--brand); }
h1 { font-size: 1.35rem; margin: 0 0 1rem; }
h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: .6rem 16px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--brand); }
.nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.nav a { padding: .4rem .7rem; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a.active { background: var(--brand-soft); color: var(--brand); }
.who { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }

.view { max-width: 1100px; margin: 0 auto; padding: 1.25rem 16px 4rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; }
.stack > * + * { margin-top: .75rem; }
.row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

button, .btn {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  padding: .5rem .9rem; border-radius: 8px; font-weight: 500;
}
button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { border: 0; background: none; color: var(--brand); padding: 0; }

input, select, textarea {
  font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: .5rem .65rem; width: 100%;
}
label { display: block; font-size: .85rem; color: var(--muted); }
label > input, label > select, label > textarea { margin-top: .25rem; }
.form-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.qty { width: 5.5rem; }

.product .name { font-weight: 600; }
.price { font-weight: 700; }
.tag { display: inline-block; font-size: .75rem; padding: .1rem .45rem; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.tag.cold { background: #e0f2fe; color: #075985; }

.status { display: inline-block; font-size: .78rem; font-weight: 600; padding: .15rem .55rem; border-radius: 99px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.status.placed { background: #fef0c7; color: #93370d; }
.status.rejected, .status.cancelled { background: #fee4e2; color: #912018; }
.status.delivered { background: #dcfae6; color: #085d3a; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }

.tabs { display: flex; gap: .25rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs button { border-radius: 99px; }
.tabs button.on { background: var(--text); color: var(--surface); border-color: var(--text); }

.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { position: relative; padding: 0 0 .9rem 1.4rem; }
.timeline li::before { content: ""; position: absolute; left: .3rem; top: .4rem; width: .55rem; height: .55rem; border-radius: 50%; background: var(--brand); }
.timeline li::after { content: ""; position: absolute; left: .55rem; top: 1rem; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }

.code { font-family: ui-monospace, monospace; font-size: 2rem; letter-spacing: .3em; font-weight: 700; color: var(--brand); }
.callout { border-left: 4px solid var(--brand); background: var(--brand-soft); padding: .75rem 1rem; border-radius: 8px; }
.banner { background: #fef0c7; color: #7a2e0e; padding: .75rem 1rem; border-radius: 8px; }

.auth { max-width: 460px; margin: 2rem auto; }
.demo button { font-size: .85rem; }
.cart-badge { background: var(--brand); color: var(--brand-ink); border-radius: 99px; padding: 0 .45rem; font-size: .75rem; margin-left: .25rem; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(150%);
  background: var(--text); color: var(--surface); padding: .65rem 1rem; border-radius: 8px;
  max-width: calc(100% - 32px); opacity: 0; visibility: hidden; transition: transform .2s, opacity .2s, visibility .2s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
.toast.error { background: var(--danger); color: #fff; }

@media (max-width: 640px) {
  .topbar { gap: .5rem; }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .who { margin-left: auto; }
  .who .name { display: none; }
}

.demo-bar { background: var(--brand-soft); color: var(--text); font-size: .85rem; padding: .45rem 16px;
  display: flex; gap: .75rem; align-items: center; justify-content: center; flex-wrap: wrap; text-align: center; }
.demo-bar button { font-size: .8rem; padding: .2rem .6rem; }
</style>
</head>
<body>
  <div class="demo-bar">Demo version: runs entirely in your browser, data stays on this device.
    <button type="button" onclick="maaResetDemo()">Reset demo data</button></div>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="9" y="3" width="6" height="18" rx="1.5" fill="currentColor"/><rect x="3" y="9" width="18" height="6" rx="1.5" fill="currentColor"/></svg>
      Maa
    </a>
    <nav id="nav" class="nav"></nav>
    <div id="who" class="who"></div>
  </header>
  <main id="view" class="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
'use strict';
/*
 * In-browser stand-in for the Maa server, used only by the standalone demo
 * (maa-demo.html). It answers the same /api routes as src/routes/*, keeps data
 * in localStorage, and intercepts window.fetch so public/app.js runs unchanged.
 */
(function () {
  const KEY = 'maa.demo.db';
  const CONFIG = { currency: 'USD', deliveryFee: 500 };
  const ACTIVE = ['placed', 'accepted', 'ready_for_pickup', 'assigned', 'picked_up'];

  function fresh() {
    const now = new Date().toISOString().slice(0, 19).replace('T', ' ');
    const orgs = [
      { id: 1, type: 'pharmacy', name: 'Al Shifa Pharmacy', license_no: 'PH-10293', address: '12 Market Street', city: 'Downtown', phone: '+100000001', verified: true, created_at: now },
      { id: 2, type: 'supplier', name: 'Nile Pharma Distribution', license_no: 'SUP-5521', address: 'Industrial Zone, Block 4', city: 'East City', phone: '+200000001', verified: true, created_at: now },
      { id: 3, type: 'supplier', name: 'MedLine Healthcare Co.', license_no: 'SUP-7780', address: '88 Logistics Park', city: 'North City', phone: '+200000002', verified: true, created_at: now },
    ];
    const u = (id, name, email, role, org_id, phone, vehicle = null) => ({ id, name, email, role, org_id, phone, vehicle, approved: true, password: 'password123', created_at: now });
    const users = [
      u(1, 'Platform Admin', 'admin@maa.test', 'admin', null, '+000000000'),
      u(2, 'Sara (Pharmacist)', 'pharmacy@maa.test', 'pharmacy', 1, '+100000001'),
      u(3, 'Omar (Nile Pharma)', 'supplier@maa.test', 'supplier', 2, '+200000001'),
      u(4, 'Lina (MedLine)', 'supplier2@maa.test', 'supplier', 3, '+200000002'),
      u(5, 'Youssef (Driver)', 'driver@maa.test', 'driver', null, '+300000001', 'Motorbike'),
    ];
    const rows = [
      [2, 'Panadol', 'Paracetamol', 'Pain relief', 'Tablet', '500 mg', 'Box of 24', 'NP-PAN-500', 350, 1200, 10, false],
      [2, 'Brufen', 'Ibuprofen', 'Pain relief', 'Tablet', '400 mg', 'Box of 30', 'NP-BRU-400', 520, 800, 5, false],
      [2, 'Augmentin', 'Amoxicillin + Clavulanate', 'Antibiotics', 'Tablet', '1 g', 'Box of 14', 'NP-AUG-1G', 1450, 300, 2, false],
      [2, 'Ventolin Inhaler', 'Salbutamol', 'Respiratory', 'Inhaler', '100 mcg', '200 doses', 'NP-VEN-100', 890, 150, 1, false],
      [2, 'Glucophage', 'Metformin', 'Diabetes', 'Tablet', '850 mg', 'Box of 30', 'NP-GLU-850', 410, 600, 5, false],
      [3, 'Lantus SoloStar', 'Insulin glargine', 'Diabetes', 'Pen', '100 IU/ml', '5 pens', 'ML-LAN-100', 6200, 60, 1, true],
      [3, 'Concor', 'Bisoprolol', 'Cardio', 'Tablet', '5 mg', 'Box of 30', 'ML-CON-5', 640, 400, 3, false],
      [3, 'Nexium', 'Esomeprazole', 'Gastro', 'Capsule', '40 mg', 'Box of 14', 'ML-NEX-40', 1180, 250, 2, false],
      [3, 'Zyrtec', 'Cetirizine', 'Allergy', 'Tablet', '10 mg', 'Box of 20', 'ML-ZYR-10', 460, 500, 5, false],
      [3, 'Panadol', 'Paracetamol', 'Pain relief', 'Tablet', '500 mg', 'Box of 24', 'ML-PAN-500', 340, 900, 10, false],
    ];
    const products = rows.map((r, i) => ({
      id: i + 1, supplier_id: r[0], name: r[1], generic_name: r[2], category: r[3], form: r[4], strength: r[5],
      pack_size: r[6], sku: r[7], price: r[8], stock: r[9], min_order_qty: r[10], cold_chain: r[11], active: true,
    }));
    return { orgs, users, products, orders: [], seq: { org: 3, user: 5, product: products.length, order: 0 } };
  }

  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch { db = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* storage unavailable: keep in memory */ } };
  window.maaResetDemo = () => { db = fresh(); save(); try { localStorage.removeItem('maa.token'); localStorage.removeItem('maa.cart'); } catch { /* ignore */ } location.hash = ''; location.reload(); };

  class E extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  const nowStr = () => new Date().toISOString().slice(0, 19).replace('T', ' ');
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const org = (id) => db.orgs.find((o) => o.id === id);
  const userById = (id) => db.users.find((u) => u.id === id);
  const prodCols = (p) => { const { ...c } = p; return c; };

  function publicUser(u) {
    const o = u.org_id ? org(u.org_id) : null;
    return { id: u.id, name: u.name, email: u.email, phone: u.phone, role: u.role, vehicle: u.vehicle, approved: u.approved, organization: o && clone(o) };
  }

  function need(user, ...roles) {
    if (!user) throw new E(401, 'Login required');
    if (roles.length && !roles.includes(user.role)) throw new E(403, 'Not allowed for your role');
    if (!user.approved) throw new E(403, 'Your account is awaiting approval');
    if (user.org_id && !org(user.org_id).verified) throw new E(403, 'Your organization is awaiting license verification');
  }
  const str = (v, f, req = true) => { const t = typeof v === 'string' ? v.trim() : ''; if (req && !t) throw new E(400, `${f} is required`); return t || null; };
  const int = (v, f, min = 0) => { const n = Number(v); if (v === '' || v == null || !Number.isInteger(n) || n < min) throw new E(400, `${f} must be a whole number of at least ${min}`); return n; };

  function addEvent(o, status, actor, note = null) {
    const a = actor && userById(actor);
    o.events.push({ status, note, created_at: nowStr(), actor_name: a?.name ?? null, actor_role: a?.role ?? null });
  }
  function setStatus(o, from, to, actor, note, extra = {}) {
    if (!from.includes(o.status)) throw new E(409, `Order cannot move to "${to}" from its current status`);
    o.status = to; o.updated_at = nowStr(); Object.assign(o, extra); addEvent(o, to, actor, note);
  }
  function restock(o) { for (const it of o.items) { const p = db.products.find((x) => x.id === it.product_id); if (p) p.stock += it.qty; } }

  function view(o, user) {
    const ph = org(o.pharmacy_id); const su = org(o.supplier_id); const d = o.driver_id && userById(o.driver_id);
    const canSee = user.role === 'admin' || (user.role === 'pharmacy' && o.pharmacy_id === user.org_id)
      || (user.role === 'supplier' && o.supplier_id === user.org_id)
      || (user.role === 'driver' && (o.driver_id === user.id || o.status === 'ready_for_pickup'));
    if (!canSee) return null;
    const out = {
      ...clone(o), pharmacy_name: ph.name, pharmacy_phone: ph.phone, pharmacy_city: ph.city,
      supplier_name: su.name, supplier_address: su.address, supplier_phone: su.phone,
      driver_name: d?.name ?? null, driver_phone: d?.phone ?? null, driver_vehicle: d?.vehicle ?? null,
      item_count: o.items.length,
    };
    if (!(user.role === 'pharmacy' || user.role === 'admin')) delete out.delivery_code;
    return out;
  }
  const findOrder = (id) => db.orders.find((o) => o.id === Number(id));

  // [method, pattern, handler(ctx)] — ctx = { user, body, query, params }
  const routes = [
    ['GET', '/api/config', () => CONFIG],

    ['POST', '/api/auth/login', ({ body }) => {
      const u = db.users.find((x) => x.email === String(body.email || '').trim().toLowerCase());
      if (!u || u.password !== body.password) throw new E(401, 'Wrong email or password');
      return { token: String(u.id), user: publicUser(u) };
    }],
    ['POST', '/api/auth/register', ({ body }) => {
      if (!['pharmacy', 'supplier', 'driver'].includes(body.role)) throw new E(400, 'role must be pharmacy, supplier or driver');
      const email = str(body.email, 'email').toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new E(400, 'email is invalid');
      if (db.users.some((u) => u.email === email)) throw new E(409, 'An account with this email already exists');
      if (String(body.password || '').length < 8) throw new E(400, 'password must be at least 8 characters');
      let org_id = null;
      if (body.role !== 'driver') {
        const o = body.organization || {};
        org_id = ++db.seq.org;
        db.orgs.push({ id: org_id, type: body.role, name: str(o.name, 'organization.name'), license_no: str(o.license_no, 'organization.license_no'),
          address: str(o.address, 'organization.address'), city: str(o.city, 'city', false), phone: str(body.phone, 'phone'), verified: false, created_at: nowStr() });
      }
      const u = { id: ++db.seq.user, name: str(body.name, 'name'), email, phone: str(body.phone, 'phone'), role: body.role, org_id,
        vehicle: body.role === 'driver' ? str(body.vehicle, 'vehicle', false) : null, approved: body.role !== 'driver', password: body.password, created_at: nowStr() };
      db.users.push(u);
      return { status: 201, body: { token: String(u.id), user: publicUser(u) } };
    }],
    ['GET', '/api/me', ({ user }) => { if (!user) throw new E(401, 'Login required'); return { user: publicUser(user) }; }],

    ['GET', '/api/suppliers', ({ user }) => {
      need(user, 'pharmacy', 'admin');
      return { suppliers: db.orgs.filter((o) => o.type === 'supplier' && o.verified).sort((a, b) => a.name.localeCompare(b.name))
        .map((o) => ({ id: o.id, name: o.name, city: o.city, phone: o.phone, product_count: db.products.filter((p) => p.supplier_id === o.id && p.active).length })) };
    }],
    ['GET', '/api/products', ({ user, query }) => {
      need(user, 'pharmacy', 'admin');
      const live = db.products.filter((p) => p.active && org(p.supplier_id).verified);
      const q = (query.get('q') || '').trim().toLowerCase();
      const sup = query.get('supplier'); const cat = query.get('category');
      const products = live.filter((p) => (!q || [p.name, p.generic_name, p.sku].some((x) => (x || '').toLowerCase().includes(q)))
        && (!sup || p.supplier_id === Number(sup)) && (!cat || p.category === cat))
        .sort((a, b) => a.name.localeCompare(b.name)).map((p) => ({ ...prodCols(p), supplier_name: org(p.supplier_id).name }));
      return { products, categories: [...new Set(live.map((p) => p.category).filter(Boolean))].sort() };
    }],
    ['GET', '/api/supplier/products', ({ user }) => {
      need(user, 'supplier');
      return { products: db.products.filter((p) => p.supplier_id === user.org_id).sort((a, b) => a.name.localeCompare(b.name)).map(prodCols) };
    }],
    ['POST', '/api/supplier/products', ({ user, body }) => {
      need(user, 'supplier');
      const p = { id: ++db.seq.product, supplier_id: user.org_id, ...readProduct(body, false) };
      db.products.push(p);
      return { status: 201, body: { product: prodCols(p) } };
    }],
    ['PATCH', '/api/supplier/products/:id', ({ user, body, params }) => {
      need(user, 'supplier');
      const p = db.products.find((x) => x.id === Number(params.id) && x.supplier_id === user.org_id);
      if (!p) throw new E(404, 'Product not found');
      Object.assign(p, readProduct(body, true));
      return { product: prodCols(p) };
    }],

    ['POST', '/api/orders', ({ user, body }) => {
      need(user, 'pharmacy');
      if (!Array.isArray(body.items) || !body.items.length) throw new E(400, 'items must be a non-empty list');
      const pay = body.payment_method ?? 'cash_on_delivery';
      if (!['cash_on_delivery', 'credit'].includes(pay)) throw new E(400, 'payment_method must be cash_on_delivery or credit');
      const qty = new Map();
      for (const it of body.items) { const id = int(it.product_id, 'product_id', 1); qty.set(id, (qty.get(id) || 0) + int(it.qty, 'qty', 1)); }
      // Validate everything first so a failure changes nothing (same as the server's transaction).
      const bySup = new Map();
      for (const [pid, q] of qty) {
        const p = db.products.find((x) => x.id === pid && x.active && org(x.supplier_id).verified);
        if (!p) throw new E(400, `Product ${pid} is not available`);
        if (q < p.min_order_qty) throw new E(400, `Minimum order for ${p.name} is ${p.min_order_qty}`);
        if (p.stock < q) throw new E(409, `Not enough stock for ${p.name} (available: ${p.stock})`);
        if (!bySup.has(p.supplier_id)) bySup.set(p.supplier_id, []);
        bySup.get(p.supplier_id).push({ p, q });
      }
      const ph = org(user.org_id);
      const created = [];
      for (const [sid, lines] of bySup) {
        const items = lines.map(({ p, q }) => {
          p.stock -= q;
          return { product_id: p.id, name: [p.name, p.strength, p.form, p.pack_size].filter(Boolean).join(' · '), unit_price: p.price, qty: q, line_total: p.price * q };
        });
        const subtotal = items.reduce((s, i) => s + i.line_total, 0);
        const o = { id: ++db.seq.order, pharmacy_id: ph.id, supplier_id: sid, placed_by: user.id, status: 'placed', subtotal,
          delivery_fee: CONFIG.deliveryFee, total: subtotal + CONFIG.deliveryFee, payment_method: pay, notes: str(body.notes, 'notes', false),
          delivery_address: [ph.address, ph.city].filter(Boolean).join(', '), delivery_code: String(Math.floor(Math.random() * 1e6)).padStart(6, '0'),
          driver_id: null, created_at: nowStr(), updated_at: nowStr(), items, events: [] };
        addEvent(o, 'placed', user.id);
        db.orders.push(o); created.push(o);
      }
      return { status: 201, body: { orders: created.map((o) => view(o, user)) } };
    }],
    ['GET', '/api/orders', ({ user, query }) => {
      need(user);
      const st = (query.get('status') || '').split(',').filter(Boolean);
      const mine = db.orders.filter((o) => (user.role === 'pharmacy' ? o.pharmacy_id === user.org_id
        : user.role === 'supplier' ? o.supplier_id === user.org_id : user.role === 'driver' ? o.driver_id === user.id : true)
        && (!st.length || st.includes(o.status)));
      return { orders: mine.sort((a, b) => b.id - a.id).map((o) => view(o, user)) };
    }],
    ['GET', '/api/orders/:id', ({ user, params }) => {
      need(user);
      const o = findOrder(params.id); const v = o && view(o, user);
      if (!v) throw new E(404, 'Order not found');
      return { order: v };
    }],
    ['POST', '/api/orders/:id/:act', ({ user, body, params }) => {
      const { act } = params;
      const side = act === 'cancel' ? user?.role : 'supplier';
      need(user, ...(act === 'cancel' ? ['pharmacy', 'supplier'] : ['supplier']));
      const o = findOrder(params.id);
      if (!o || o[`${side}_id`] !== user.org_id) throw new E(404, 'Order not found');
      if (act === 'accept') setStatus(o, ['placed'], 'accepted', user.id, str(body.note, 'note', false));
      else if (act === 'reject') { setStatus(o, ['placed'], 'rejected', user.id, str(body.reason, 'reason')); restock(o); }
      else if (act === 'ready') setStatus(o, ['accepted'], 'ready_for_pickup', user.id, 'Packed and waiting for a driver');
      else if (act === 'cancel') {
        setStatus(o, side === 'pharmacy' ? ['placed'] : ['accepted', 'ready_for_pickup'], 'cancelled', user.id, str(body.reason, 'reason', false));
        restock(o);
      } else throw new E(404, 'Not found');
      return { order: view(o, user) };
    }],

    ['GET', '/api/deliveries/available', ({ user }) => {
      need(user, 'driver');
      return { jobs: db.orders.filter((o) => o.status === 'ready_for_pickup').map((o) => {
        const su = org(o.supplier_id); const ph = org(o.pharmacy_id);
        return { id: o.id, total: o.total, delivery_fee: o.delivery_fee, payment_method: o.payment_method, updated_at: o.updated_at,
          supplier_name: su.name, pickup_address: su.address, pickup_city: su.city, pharmacy_name: ph.name, delivery_address: o.delivery_address,
          item_count: o.items.length, cold_chain: o.items.some((i) => db.products.find((p) => p.id === i.product_id)?.cold_chain) };
      }) };
    }],
    ['POST', '/api/deliveries/:id/:act', ({ user, body, params }) => {
      need(user, 'driver');
      const o = findOrder(params.id);
      if (!o) throw new E(404, 'Delivery not found');
      if (params.act === 'claim') {
        setStatus(o, ['ready_for_pickup'], 'assigned', user.id, `Driver ${user.name} assigned`, { driver_id: user.id });
        return { order: view(o, user) };
      }
      if (o.driver_id !== user.id) throw new E(404, 'Delivery not found');
      if (params.act === 'release') { setStatus(o, ['assigned'], 'ready_for_pickup', user.id, 'Driver released the job', { driver_id: null }); return { ok: true }; }
      if (params.act === 'pickup') setStatus(o, ['assigned'], 'picked_up', user.id, 'Collected from supplier, on the way');
      else if (params.act === 'deliver') {
        if (o.status !== 'picked_up') throw new E(409, 'Order has not been picked up yet');
        if (str(body.code, 'code') !== o.delivery_code) throw new E(400, 'Delivery code is incorrect');
        setStatus(o, ['picked_up'], 'delivered', user.id, str(body.note, 'note', false) || 'Handed over to pharmacy');
      } else throw new E(404, 'Not found');
      return { order: view(o, user) };
    }],

    ['GET', '/api/admin/overview', ({ user }) => {
      need(user, 'admin');
      const delivered = db.orders.filter((o) => o.status === 'delivered');
      return {
        organizations: clone(db.orgs).sort((a, b) => a.verified - b.verified),
        drivers: db.users.filter((u) => u.role === 'driver').map(({ id, name, email, phone, vehicle, approved, created_at }) => ({ id, name, email, phone, vehicle, approved, created_at }))
          .sort((a, b) => a.approved - b.approved),
        stats: { orders: db.orders.length, delivered: delivered.length, delivered_value: delivered.reduce((s, o) => s + o.total, 0),
          in_progress: db.orders.filter((o) => ACTIVE.includes(o.status)).length },
      };
    }],
    ['POST', '/api/admin/organizations/:id/verify', ({ user, body, params }) => {
      need(user, 'admin');
      const o = org(Number(params.id)); if (!o) throw new E(404, 'Organization not found');
      o.verified = body.verified !== false; return { ok: true };
    }],
    ['POST', '/api/admin/drivers/:id/approve', ({ user, body, params }) => {
      need(user, 'admin');
      const d = db.users.find((u) => u.id === Number(params.id) && u.role === 'driver'); if (!d) throw new E(404, 'Driver not found');
      d.approved = body.approved !== false; return { ok: true };
    }],
  ];

  function readProduct(b, partial) {
    const out = {};
    const take = (k, fn) => { if (partial && b[k] === undefined) return; out[k] = fn(b[k]); };
    take('name', (x) => str(x, 'name'));
    for (const k of ['generic_name', 'category', 'form', 'strength', 'pack_size', 'sku']) take(k, (x) => str(x, k, false));
    take('price', (x) => { const n = Number(x); if (x === '' || x == null || !(n >= 0)) throw new E(400, 'price must be a positive amount'); return Math.round(n * 100); });
    take('stock', (x) => int(x ?? 0, 'stock', 0));
    take('min_order_qty', (x) => int(x ?? 1, 'min_order_qty', 1));
    take('cold_chain', (x) => !!x);
    take('active', (x) => (x === undefined ? true : !!x));
    return out;
  }

  const compiled = routes.map(([m, p, h]) => [m, new RegExp('^' + p.replace(/:(\w+)/g, '(?<$1>[^/]+)') + '$'), h]);
  const realFetch = window.fetch.bind(window);

  window.fetch = async (input, init = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
    const method = (init.method || 'GET').toUpperCase();
    const reply = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'content-type': 'application/json' } });
    const auth = new Headers(init.headers || {}).get('authorization') || '';
    const user = auth.startsWith('Bearer ') ? userById(Number(auth.slice(7))) : null;
    let body = {};
    try { body = init.body ? JSON.parse(init.body) : {}; } catch { return reply(400, { error: 'Invalid JSON' }); }
    for (const [m, re, h] of compiled) {
      const match = m === method && url.pathname.match(re);
      if (!match) continue;
      try {
        const out = h({ user, body, query: url.searchParams, params: match.groups || {} });
        save();
        return out && out.status && out.body ? reply(out.status, out.body) : reply(200, out);
      } catch (e) {
        if (!(e instanceof E)) console.error(e);
        return reply(e.status || 500, { error: e instanceof E ? e.message : 'Internal error' });
      }
    }
    return reply(404, { error: 'Not found' });
  };
})();

</script>
  <script>
'use strict';
/* Maa web client: one page, hash routes, a view per role. No build step. */

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const state = {
  token: localGet('maa.token'),
  user: null,
  config: { currency: 'USD', deliveryFee: 0 },
  cart: JSON.parse(localGet('maa.cart') || '{}'), // productId -> { product, qty }
  refreshTimer: null,
};

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* private mode */ } }
const saveCart = () => localSet('maa.cart', JSON.stringify(state.cart));

const money = (minor) => new Intl.NumberFormat(undefined, { style: 'currency', currency: state.config.currency }).format((minor || 0) / 100);
const when = (iso) => new Date(iso.replace(' ', 'T') + 'Z').toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

const STATUS_LABEL = {
  placed: 'Awaiting supplier', accepted: 'Being prepared', rejected: 'Rejected', cancelled: 'Cancelled',
  ready_for_pickup: 'Ready for pickup', assigned: 'Driver assigned', picked_up: 'On the way', delivered: 'Delivered',
};
const statusPill = (s) => `<span class="status ${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', ...(state.token && { authorization: `Bearer ${state.token}` }) },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && state.token) { logout(); }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `toast show${isError ? ' error' : ''}`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = 'toast'; }, 3000);
}

/** Wrap an async click handler: disable the button and surface errors. */
function action(fn) {
  return async (ev) => {
    const btn = ev?.currentTarget;
    if (btn) btn.disabled = true;
    try { await fn(ev); } catch (e) { toast(e.message, true); } finally { if (btn && btn.isConnected) btn.disabled = false; }
  };
}

function logout() {
  state.token = null; state.user = null; state.cart = {};
  localSet('maa.token', null); saveCart();
  location.hash = '#/login';
  render();
}

// ---------------------------------------------------------------- routing

const NAV = {
  pharmacy: [['#/catalog', 'Catalog'], ['#/cart', 'Cart'], ['#/orders', 'My orders']],
  supplier: [['#/incoming', 'Orders'], ['#/products', 'My products']],
  driver: [['#/jobs', 'Available jobs'], ['#/my-deliveries', 'My deliveries']],
  admin: [['#/admin', 'Verification'], ['#/orders', 'All orders']],
};
const HOME = { pharmacy: '#/catalog', supplier: '#/incoming', driver: '#/jobs', admin: '#/admin' };

async function render() {
  clearInterval(state.refreshTimer);
  const view = $('#view');
  const [route, param] = location.hash.replace(/^#\//, '').split('/');

  if (!state.user) {
    $('#nav').innerHTML = ''; $('#who').innerHTML = '';
    return route === 'register' ? renderRegister(view) : renderLogin(view);
  }

  const u = state.user;
  const cartCount = Object.keys(state.cart).length;
  $('#nav').innerHTML = (NAV[u.role] || []).map(([href, label]) =>
    `<a href="${href}" class="${location.hash.startsWith(href) ? 'active' : ''}">${label}${href === '#/cart' && cartCount ? `<span class="cart-badge">${cartCount}</span>` : ''}</a>`).join('');
  $('#who').innerHTML = `<span class="name muted">${esc(u.organization?.name || u.name)}</span><button class="link" id="logout">Log out</button>`;
  $('#logout').onclick = logout;

  const pending = (u.organization && !u.organization.verified) || !u.approved;
  if (pending) return renderPending(view);

  const routes = {
    catalog: renderCatalog, cart: renderCart, orders: renderOrders, order: renderOrderDetail,
    incoming: renderOrders, products: renderProducts,
    jobs: renderJobs, 'my-deliveries': renderOrders,
    admin: renderAdmin,
  };
  const fn = routes[route];
  if (!fn) { location.hash = HOME[u.role]; return; }
  view.innerHTML = '<p class="muted">Loading…</p>';
  try { await fn(view, param); } catch (e) { view.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

window.addEventListener('hashchange', render);

// ---------------------------------------------------------------- auth

const DEMO = [
  ['Pharmacy', 'pharmacy@maa.test'], ['Supplier', 'supplier@maa.test'],
  ['Driver', 'driver@maa.test'], ['Admin', 'admin@maa.test'],
];

async function signedIn({ token, user }) {
  state.token = token; state.user = user;
  localSet('maa.token', token);
  location.hash = HOME[user.role];
  render();
}

function renderLogin(view) {
  view.innerHTML = `
    <div class="auth stack">
      <div class="card stack">
        <h1>Sign in</h1>
        <form id="f" class="stack">
          <label>Email<input name="email" type="email" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="primary" type="submit">Sign in</button>
        </form>
        <p class="small muted">New pharmacy, supplier company or driver? <a href="#/register">Create an account</a></p>
      </div>
      <div class="card stack demo">
        <h2>Demo accounts</h2>
        <p class="small muted">Password: <code>password123</code></p>
        <div class="row">${DEMO.map(([l, e]) => `<button data-email="${e}">${l}</button>`).join('')}</div>
      </div>
    </div>`;
  const f = $('#f', view);
  f.onsubmit = action(async (ev) => {
    ev.preventDefault();
    signedIn(await api('POST', '/api/auth/login', Object.fromEntries(new FormData(f))));
  });
  view.querySelectorAll('[data-email]').forEach((b) => {
    b.onclick = action(async () => signedIn(await api('POST', '/api/auth/login', { email: b.dataset.email, password: 'password123' })));
  });
}

function renderRegister(view) {
  view.innerHTML = `
    <div class="auth card stack">
      <h1>Create an account</h1>
      <form id="f" class="stack">
        <label>I am a
          <select name="role" id="role">
            <option value="pharmacy">Pharmacy (buyer)</option>
            <option value="supplier">Pharmaceutical company / distributor (seller)</option>
            <option value="driver">Delivery driver</option>
          </select>
        </label>
        <label>Your name<input name="name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Phone<input name="phone" type="tel" required></label>
        <label>Password (min 8 characters)<input name="password" type="password" minlength="8" required></label>
        <div id="org" class="stack">
          <label>Business name<input name="org_name" required></label>
          <label>License number<input name="license_no" required></label>
          <label>Address<input name="address" required></label>
          <label>City<input name="city"></label>
        </div>
        <div id="veh" hidden><label>Vehicle<input name="vehicle" placeholder="e.g. Motorbike, Van"></label></div>
        <p class="small muted">Licenses are checked by Maa before you can buy or sell.</p>
        <button class="primary" type="submit">Create account</button>
      </form>
      <p class="small"><a href="#/login">Back to sign in</a></p>
    </div>`;
  const f = $('#f', view);
  const sync = () => {
    const driver = $('#role', view).value === 'driver';
    $('#org', view).hidden = driver;
    $('#veh', view).hidden = !driver;
    $('#org', view).querySelectorAll('input[name=org_name], input[name=license_no], input[name=address]').forEach((i) => { i.required = !driver; });
  };
  $('#role', view).onchange = sync;
  f.onsubmit = action(async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const body = { role: d.role, name: d.name, email: d.email, phone: d.phone, password: d.password, vehicle: d.vehicle };
    if (d.role !== 'driver') body.organization = { name: d.org_name, license_no: d.license_no, address: d.address, city: d.city };
    signedIn(await api('POST', '/api/auth/register', body));
  });
}

function renderPending(view) {
  const u = state.user;
  view.innerHTML = `
    <div class="auth card stack">
      <h1>Almost there</h1>
      <p>${u.role === 'driver'
        ? 'Your driver account is waiting for approval by the Maa team.'
        : `<strong>${esc(u.organization.name)}</strong> is waiting for license verification (license ${esc(u.organization.license_no)}).`}</p>
      <p class="muted small">We'll unlock ordering and deliveries as soon as it's approved.</p>
      <button id="check">Check again</button>
    </div>`;
  $('#check', view).onclick = action(async () => {
    state.user = (await api('GET', '/api/me')).user;
    render();
  });
}

// ---------------------------------------------------------------- pharmacy

async function renderCatalog(view) {
  const params = new URLSearchParams(renderCatalog.filters || {});
  const [{ products, categories }, { suppliers }] = await Promise.all([
    api('GET', `/api/products?${params}`), api('GET', '/api/suppliers'),
  ]);
  const f = renderCatalog.filters || {};
  view.innerHTML = `
    <div class="row spread"><h1>Order from suppliers</h1></div>
    <form id="filters" class="row" style="margin-bottom:1rem">
      <input name="q" placeholder="Search by brand, generic name or SKU" value="${esc(f.q || '')}" style="flex:2;min-width:200px">
      <select name="category" style="flex:1;min-width:140px"><option value="">All categories</option>
        ${categories.map((c) => `<option ${f.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select name="supplier" style="flex:1;min-width:160px"><option value="">All suppliers</option>
        ${suppliers.map((s) => `<option value="${s.id}" ${String(f.supplier) === String(s.id) ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
      <button type="submit">Search</button>
    </form>
    ${products.length ? `<div class="grid">${products.map(productCard).join('')}</div>` : '<div class="card empty">No products match.</div>'}`;
  $('#filters', view).onsubmit = (ev) => {
    ev.preventDefault();
    renderCatalog.filters = Object.fromEntries([...new FormData(ev.target)].filter(([, v]) => v));
    render();
  };
  view.querySelectorAll('[data-add]').forEach((btn) => {
    btn.onclick = () => {
      const p = products.find((x) => x.id === Number(btn.dataset.add));
      const qty = Number(btn.parentElement.querySelector('input').value);
      if (!Number.isInteger(qty) || qty < p.min_order_qty) return toast(`Minimum order is ${p.min_order_qty}`, true);
      const prev = state.cart[p.id]?.qty || 0;
      if (prev + qty > p.stock) return toast(`Only ${p.stock} in stock`, true);
      state.cart[p.id] = { product: p, qty: prev + qty };
      saveCart();
      toast(`Added ${qty} × ${p.name}`);
      render();
    };
  });
}

function productCard(p) {
  const inCart = state.cart[p.id]?.qty;
  return `
    <div class="card product stack">
      <div>
        <div class="name">${esc(p.name)} <span class="muted">${esc(p.strength || '')}</span></div>
        <div class="small muted">${esc([p.generic_name, p.form, p.pack_size].filter(Boolean).join(' · '))}</div>
      </div>
      <div class="row small">
        ${p.category ? `<span class="tag">${esc(p.category)}</span>` : ''}
        ${p.cold_chain ? '<span class="tag cold">Cold chain</span>' : ''}
      </div>
      <div class="small">Sold by <strong>${esc(p.supplier_name)}</strong></div>
      <div class="row spread">
        <span class="price">${money(p.price)}</span>
        <span class="small muted">${p.stock > 0 ? `${p.stock} in stock` : 'Out of stock'} · min ${p.min_order_qty}</span>
      </div>
      <div class="row">
        <input class="qty" type="number" min="${p.min_order_qty}" value="${p.min_order_qty}" aria-label="Quantity">
        <button class="primary" data-add="${p.id}" ${p.stock < p.min_order_qty ? 'disabled' : ''}>Add to cart</button>
      </div>
      ${inCart ? `<div class="small muted">${inCart} in cart</div>` : ''}
    </div>`;
}

function renderCart(view) {
  const lines = Object.values(state.cart);
  if (!lines.length) {
    view.innerHTML = '<h1>Cart</h1><div class="card empty">Your cart is empty. <a href="#/catalog">Browse the catalog</a></div>';
    return;
  }
  const groups = {};
  for (const l of lines) (groups[l.product.supplier_id] ||= { name: l.product.supplier_name, lines: [] }).lines.push(l);
  const groupList = Object.values(groups);
  const subtotal = lines.reduce((s, l) => s + l.product.price * l.qty, 0);
  const fees = groupList.length * state.config.deliveryFee;

  view.innerHTML = `
    <h1>Cart</h1>
    <div class="stack">
      ${groupList.map((g) => `
        <div class="card">
          <h2>${esc(g.name)}</h2>
          <div class="table-wrap"><table>
            <tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr>
            ${g.lines.map((l) => `
              <tr>
                <td>${esc(l.product.name)} <span class="muted small">${esc(l.product.strength || '')} ${esc(l.product.pack_size || '')}</span></td>
                <td>${money(l.product.price)}</td>
                <td><input class="qty" type="number" min="${l.product.min_order_qty}" value="${l.qty}" data-qty="${l.product.id}"></td>
                <td>${money(l.product.price * l.qty)}</td>
                <td><button class="link danger" data-remove="${l.product.id}">Remove</button></td>
              </tr>`).join('')}
          </table></div>
          <p class="small muted">Delivered as a separate shipment · delivery ${money(state.config.deliveryFee)}</p>
        </div>`).join('')}
      <div class="card stack">
        <div class="row spread"><span>Products</span><span>${money(subtotal)}</span></div>
        <div class="row spread"><span>Delivery (${groupList.length} shipment${groupList.length > 1 ? 's' : ''})</span><span>${money(fees)}</span></div>
        <div class="row spread"><strong>Total</strong><strong>${money(subtotal + fees)}</strong></div>
        <label>Payment
          <select id="pay">
            <option value="cash_on_delivery">Cash on delivery</option>
            <option value="credit">Supplier credit / invoice</option>
          </select>
        </label>
        <label>Notes for suppliers (optional)<textarea id="notes" rows="2" maxlength="500"></textarea></label>
        <button class="primary" id="place">Place order</button>
      </div>
    </div>`;

  view.querySelectorAll('[data-qty]').forEach((inp) => {
    inp.onchange = () => {
      const l = state.cart[inp.dataset.qty];
      const q = Number(inp.value);
      if (!Number.isInteger(q) || q < l.product.min_order_qty) { toast(`Minimum order is ${l.product.min_order_qty}`, true); inp.value = l.qty; return; }
      l.qty = q; saveCart(); render();
    };
  });
  view.querySelectorAll('[data-remove]').forEach((b) => {
    b.onclick = () => { delete state.cart[b.dataset.remove]; saveCart(); render(); };
  });
  $('#place', view).onclick = action(async () => {
    const { orders } = await api('POST', '/api/orders', {
      items: lines.map((l) => ({ product_id: l.product.id, qty: l.qty })),
      payment_method: $('#pay', view).value,
      notes: $('#notes', view).value || undefined,
    });
    state.cart = {}; saveCart();
    toast(`${orders.length} order${orders.length > 1 ? 's' : ''} placed`);
    location.hash = orders.length === 1 ? `#/order/${orders[0].id}` : '#/orders';
  });
}

// ---------------------------------------------------------------- shared order views

const ORDER_TABS = {
  pharmacy: [['Active', 'placed,accepted,ready_for_pickup,assigned,picked_up'], ['Delivered', 'delivered'], ['Closed', 'rejected,cancelled'], ['All', '']],
  supplier: [['New', 'placed'], ['To pack', 'accepted'], ['Awaiting driver', 'ready_for_pickup'], ['In transit', 'assigned,picked_up'], ['Done', 'delivered,rejected,cancelled'], ['All', '']],
  driver: [['Current', 'assigned,picked_up'], ['Completed', 'delivered'], ['All', '']],
  admin: [['Active', 'placed,accepted,ready_for_pickup,assigned,picked_up'], ['All', '']],
};

async function renderOrders(view) {
  const role = state.user.role;
  const tabs = ORDER_TABS[role];
  const tab = renderOrders.tab?.[role] ?? 0;
  const { orders } = await api('GET', `/api/orders?status=${tabs[tab][1]}`);
  const title = { pharmacy: 'My orders', supplier: 'Incoming orders', driver: 'My deliveries', admin: 'All orders' }[role];
  const counterparty = (o) => (role === 'pharmacy' ? o.supplier_name : role === 'supplier' ? o.pharmacy_name : `${o.supplier_name} → ${o.pharmacy_name}`);

  view.innerHTML = `
    <h1>${title}</h1>
    <div class="tabs">${tabs.map(([l], i) => `<button data-tab="${i}" class="${i === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${orders.length ? `
    <div class="card table-wrap"><table>
      <tr><th>#</th><th>${role === 'pharmacy' ? 'Supplier' : role === 'supplier' ? 'Pharmacy' : 'Route'}</th><th>Items</th><th>Total</th><th>Status</th><th>Updated</th></tr>
      ${orders.map((o) => `
        <tr class="clickable" data-id="${o.id}">
          <td>${o.id}</td><td>${esc(counterparty(o))}</td><td>${o.item_count}</td><td>${money(o.total)}</td>
          <td>${statusPill(o.status)}</td><td class="small muted">${when(o.updated_at)}</td>
        </tr>`).join('')}
    </table></div>` : '<div class="card empty">Nothing here yet.</div>'}`;

  view.querySelectorAll('[data-tab]').forEach((b) => {
    b.onclick = () => { renderOrders.tab = { ...renderOrders.tab, [role]: Number(b.dataset.tab) }; render(); };
  });
  view.querySelectorAll('[data-id]').forEach((tr) => { tr.onclick = () => { location.hash = `#/order/${tr.dataset.id}`; }; });
  state.refreshTimer = setInterval(() => { if (!document.hidden) render(); }, 20000);
}

async function renderOrderDetail(view, id) {
  const { order: o } = await api('GET', `/api/orders/${encodeURIComponent(id)}`);
  const role = state.user.role;
  const backHref = { pharmacy: '#/orders', supplier: '#/incoming', driver: o.driver_id ? '#/my-deliveries' : '#/jobs', admin: '#/orders' }[role];

  const actions = [];
  if (role === 'supplier') {
    if (o.status === 'placed') actions.push('<button class="primary" data-act="accept">Accept order</button>', '<button class="danger" data-act="reject">Reject</button>');
    if (o.status === 'accepted') actions.push('<button class="primary" data-act="ready">Packed · ready for pickup</button>');
    if (['accepted', 'ready_for_pickup'].includes(o.status)) actions.push('<button class="danger" data-act="cancel">Cancel order</button>');
  }
  if (role === 'pharmacy' && o.status === 'placed') actions.push('<button class="danger" data-act="cancel">Cancel order</button>');
  if (role === 'driver') {
    if (o.status === 'ready_for_pickup') actions.push('<button class="primary" data-act="claim">Take this delivery</button>');
    if (o.status === 'assigned') actions.push('<button class="primary" data-act="pickup">Collected from supplier</button>', '<button data-act="release">Give up job</button>');
    if (o.status === 'picked_up') actions.push(`
      <form id="deliver" class="row">
        <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code from pharmacy" required style="max-width:240px">
        <button class="primary" type="submit">Confirm delivery</button>
      </form>`);
  }

  const showCode = role === 'pharmacy' && ['assigned', 'picked_up'].includes(o.status) && o.delivery_code;

  view.innerHTML = `
    <p><a href="${backHref}">← Back</a></p>
    <div class="row spread"><h1>Order #${o.id}</h1>${statusPill(o.status)}</div>
    <div class="stack">
      ${showCode ? `
        <div class="callout stack">
          <div><strong>Your delivery code</strong> · give this to the driver when the goods arrive</div>
          <div class="code">${esc(o.delivery_code)}</div>
        </div>` : ''}
      ${actions.length ? `<div class="card row">${actions.join('')}</div>` : ''}
      <div class="grid">
        <div class="card stack small">
          <h2>Pickup</h2>
          <div><strong>${esc(o.supplier_name)}</strong></div>
          ${role !== 'pharmacy' ? `<div>${esc(o.supplier_address)}</div>` : ''}
          ${o.supplier_phone ? `<div><a href="tel:${esc(o.supplier_phone)}">${esc(o.supplier_phone)}</a></div>` : ''}
        </div>
        <div class="card stack small">
          <h2>Deliver to</h2>
          <div><strong>${esc(o.pharmacy_name)}</strong></div>
          <div>${esc(o.delivery_address)}</div>
          ${o.pharmacy_phone ? `<div><a href="tel:${esc(o.pharmacy_phone)}">${esc(o.pharmacy_phone)}</a></div>` : ''}
        </div>
        <div class="card stack small">
          <h2>Driver</h2>
          ${o.driver_name ? `<div><strong>${esc(o.driver_name)}</strong> ${o.driver_vehicle ? `· ${esc(o.driver_vehicle)}` : ''}</div>
            ${o.driver_phone ? `<div><a href="tel:${esc(o.driver_phone)}">${esc(o.driver_phone)}</a></div>` : ''}` : '<div class="muted">Not assigned yet</div>'}
          <div>Payment: ${o.payment_method === 'credit' ? 'Supplier credit' : `Cash on delivery · collect <strong>${money(o.total)}</strong>`}</div>
        </div>
      </div>
      <div class="card table-wrap">
        <h2>Items</h2>
        <table>
          <tr><th>Product</th><th>Unit</th><th>Qty</th><th>Total</th></tr>
          ${o.items.map((i) => `<tr><td>${esc(i.name)}</td><td>${money(i.unit_price)}</td><td>${i.qty}</td><td>${money(i.line_total)}</td></tr>`).join('')}
          <tr><td colspan="3" class="muted">Delivery</td><td>${money(o.delivery_fee)}</td></tr>
          <tr><td colspan="3"><strong>Total</strong></td><td><strong>${money(o.total)}</strong></td></tr>
        </table>
        ${o.notes ? `<p class="small"><strong>Notes:</strong> ${esc(o.notes)}</p>` : ''}
      </div>
      <div class="card">
        <h2>Tracking</h2>
        <ul class="timeline">
          ${o.events.map((e) => `
            <li><strong>${esc(STATUS_LABEL[e.status] || e.status)}</strong>
              <div class="small muted">${when(e.created_at)}${e.actor_name ? ` · ${esc(e.actor_name)}` : ''}</div>
              ${e.note ? `<div class="small">${esc(e.note)}</div>` : ''}</li>`).join('')}
        </ul>
      </div>
    </div>`;

  const ORDER_ACTIONS = { accept: 'orders', reject: 'orders', ready: 'orders', cancel: 'orders', claim: 'deliveries', pickup: 'deliveries', release: 'deliveries' };
  view.querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = action(async () => {
      const act = b.dataset.act;
      let body = {};
      if (act === 'reject' || act === 'cancel') {
        const reason = prompt(act === 'reject' ? 'Reason for rejecting (shown to the pharmacy):' : 'Reason for cancelling (optional):');
        if (reason === null) return;
        if (act === 'reject' && !reason.trim()) return toast('A reason is required', true);
        body = { reason: reason.trim() || undefined };
      }
      await api('POST', `/api/${ORDER_ACTIONS[act]}/${o.id}/${act}`, body);
      toast('Updated');
      if (act === 'release') location.hash = '#/jobs'; else render();
    });
  });
  const df = $('#deliver', view);
  if (df) {
    df.onsubmit = action(async (ev) => {
      ev.preventDefault();
      await api('POST', `/api/deliveries/${o.id}/deliver`, { code: new FormData(df).get('code') });
      toast('Delivery confirmed');
      render();
    });
  }
  if (!['delivered', 'rejected', 'cancelled'].includes(o.status)) {
    state.refreshTimer = setInterval(() => { if (!document.hidden && !document.activeElement?.closest('form')) render(); }, 15000);
  }
}

// ---------------------------------------------------------------- supplier

async function renderProducts(view) {
  const { products } = await api('GET', '/api/supplier/products');
  const editing = renderProducts.editing;
  const e = editing ? products.find((p) => p.id === editing) : null;
  const val = (k, d = '') => esc(e ? e[k] ?? d : d);

  view.innerHTML = `
    <h1>My products</h1>
    <div class="stack">
      <form id="pf" class="card stack">
        <h2>${e ? `Edit ${esc(e.name)}` : 'Add a product'}</h2>
        <div class="form-grid">
          <label>Brand name<input name="name" required value="${val('name')}"></label>
          <label>Generic name<input name="generic_name" value="${val('generic_name')}"></label>
          <label>Category<input name="category" value="${val('category')}" placeholder="e.g. Antibiotics"></label>
          <label>Form<input name="form" value="${val('form')}" placeholder="Tablet, Syrup…"></label>
          <label>Strength<input name="strength" value="${val('strength')}" placeholder="500 mg"></label>
          <label>Pack size<input name="pack_size" value="${val('pack_size')}" placeholder="Box of 20"></label>
          <label>SKU<input name="sku" value="${val('sku')}"></label>
          <label>Price per pack (${esc(state.config.currency)})<input name="price" type="number" step="0.01" min="0" required value="${e ? e.price / 100 : ''}"></label>
          <label>Stock (packs)<input name="stock" type="number" min="0" required value="${val('stock', 0)}"></label>
          <label>Minimum order<input name="min_order_qty" type="number" min="1" required value="${val('min_order_qty', 1)}"></label>
        </div>
        <div class="row">
          <label class="row" style="color:inherit"><input type="checkbox" name="cold_chain" style="width:auto" ${e?.cold_chain ? 'checked' : ''}> Needs cold chain</label>
          <label class="row" style="color:inherit"><input type="checkbox" name="active" style="width:auto" ${!e || e.active ? 'checked' : ''}> Listed for sale</label>
        </div>
        <div class="row">
          <button class="primary" type="submit">${e ? 'Save changes' : 'Add product'}</button>
          ${e ? '<button type="button" id="cancelEdit">Cancel</button>' : ''}
        </div>
      </form>
      <div class="card table-wrap">
        ${products.length ? `<table>
          <tr><th>Product</th><th>Price</th><th>Stock</th><th>Min</th><th>Status</th><th></th></tr>
          ${products.map((p) => `
            <tr>
              <td><strong>${esc(p.name)}</strong> <span class="small muted">${esc([p.strength, p.form, p.pack_size].filter(Boolean).join(' · '))}</span>
                ${p.cold_chain ? ' <span class="tag cold">Cold</span>' : ''}</td>
              <td>${money(p.price)}</td>
              <td>${p.stock}${p.stock < 20 ? ' <span class="small" style="color:var(--warn)">low</span>' : ''}</td>
              <td>${p.min_order_qty}</td>
              <td>${p.active ? 'Listed' : '<span class="muted">Hidden</span>'}</td>
              <td><button class="link" data-edit="${p.id}">Edit</button></td>
            </tr>`).join('')}
        </table>` : '<div class="empty">No products yet. Add your first one above.</div>'}
      </div>
    </div>`;

  const f = $('#pf', view);
  f.onsubmit = action(async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    const body = { ...d, cold_chain: !!d.cold_chain, active: !!d.active };
    if (e) await api('PATCH', `/api/supplier/products/${e.id}`, body);
    else await api('POST', '/api/supplier/products', body);
    toast(e ? 'Product updated' : 'Product added');
    renderProducts.editing = null;
    render();
  });
  view.querySelectorAll('[data-edit]').forEach((b) => {
    b.onclick = () => { renderProducts.editing = Number(b.dataset.edit); render(); window.scrollTo(0, 0); };
  });
  $('#cancelEdit', view)?.addEventListener('click', () => { renderProducts.editing = null; render(); });
}

// ---------------------------------------------------------------- driver

async function renderJobs(view) {
  const { jobs } = await api('GET', '/api/deliveries/available');
  view.innerHTML = `
    <h1>Available jobs</h1>
    ${jobs.length ? `<div class="grid">${jobs.map((j) => `
      <div class="card stack small">
        <div class="row spread"><strong>Order #${j.id}</strong><span class="price">${money(j.delivery_fee)}</span></div>
        <div><span class="muted">Pick up</span><br><strong>${esc(j.supplier_name)}</strong><br>${esc([j.pickup_address, j.pickup_city].filter(Boolean).join(', '))}</div>
        <div><span class="muted">Drop off</span><br><strong>${esc(j.pharmacy_name)}</strong><br>${esc(j.delivery_address)}</div>
        <div class="row">${j.item_count} product${j.item_count === 1 ? '' : 's'} ${j.cold_chain ? '<span class="tag cold">Cold chain</span>' : ''}
          ${j.payment_method === 'cash_on_delivery' ? `<span class="tag">Collect ${money(j.total)}</span>` : ''}</div>
        <div class="row"><button class="primary" data-claim="${j.id}">Take job</button><a href="#/order/${j.id}">Details</a></div>
      </div>`).join('')}</div>` : '<div class="card empty">No deliveries waiting right now. This page refreshes automatically.</div>'}`;
  view.querySelectorAll('[data-claim]').forEach((b) => {
    b.onclick = action(async () => {
      await api('POST', `/api/deliveries/${b.dataset.claim}/claim`);
      toast('Job is yours. Head to the supplier.');
      location.hash = `#/order/${b.dataset.claim}`;
    });
  });
  state.refreshTimer = setInterval(() => { if (!document.hidden) render(); }, 15000);
}

// ---------------------------------------------------------------- admin

async function renderAdmin(view) {
  const { organizations, drivers, stats } = await api('GET', '/api/admin/overview');
  view.innerHTML = `
    <h1>Verification</h1>
    <div class="grid" style="margin-bottom:1rem">
      <div class="card"><div class="muted small">Orders</div><div class="price">${stats.orders}</div></div>
      <div class="card"><div class="muted small">In progress</div><div class="price">${stats.in_progress || 0}</div></div>
      <div class="card"><div class="muted small">Delivered value</div><div class="price">${money(stats.delivered_value)}</div></div>
    </div>
    <div class="stack">
      <div class="card table-wrap"><h2>Pharmacies &amp; suppliers</h2><table>
        <tr><th>Name</th><th>Type</th><th>License</th><th>Address</th><th>Status</th><th></th></tr>
        ${organizations.map((o) => `<tr>
          <td>${esc(o.name)}</td><td>${esc(o.type)}</td><td>${esc(o.license_no)}</td><td class="small">${esc([o.address, o.city].filter(Boolean).join(', '))}</td>
          <td>${o.verified ? '<span class="status delivered">Verified</span>' : '<span class="status placed">Pending</span>'}</td>
          <td><button data-org="${o.id}" data-v="${o.verified ? 0 : 1}" class="${o.verified ? 'danger' : 'primary'}">${o.verified ? 'Suspend' : 'Verify'}</button></td>
        </tr>`).join('')}
      </table></div>
      <div class="card table-wrap"><h2>Drivers</h2><table>
        <tr><th>Name</th><th>Phone</th><th>Vehicle</th><th>Status</th><th></th></tr>
        ${drivers.map((d) => `<tr>
          <td>${esc(d.name)}<div class="small muted">${esc(d.email)}</div></td><td>${esc(d.phone)}</td><td>${esc(d.vehicle || '')}</td>
          <td>${d.approved ? '<span class="status delivered">Approved</span>' : '<span class="status placed">Pending</span>'}</td>
          <td><button data-drv="${d.id}" data-v="${d.approved ? 0 : 1}" class="${d.approved ? 'danger' : 'primary'}">${d.approved ? 'Suspend' : 'Approve'}</button></td>
        </tr>`).join('')}
      </table></div>
    </div>`;
  view.querySelectorAll('[data-org]').forEach((b) => {
    b.onclick = action(async () => { await api('POST', `/api/admin/organizations/${b.dataset.org}/verify`, { verified: b.dataset.v === '1' }); render(); });
  });
  view.querySelectorAll('[data-drv]').forEach((b) => {
    b.onclick = action(async () => { await api('POST', `/api/admin/drivers/${b.dataset.drv}/approve`, { approved: b.dataset.v === '1' }); render(); });
  });
}

// ---------------------------------------------------------------- boot

(async function boot() {
  try { state.config = await api('GET', '/api/config'); } catch { /* use defaults */ }
  if (state.token) {
    try { state.user = (await api('GET', '/api/me')).user; } catch { state.token = null; localSet('maa.token', null); }
  }
  render();
})();

</script>
</body>
</html>
