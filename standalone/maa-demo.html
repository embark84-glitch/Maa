<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Maa Pharmacy Supply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <style>
:root {
  --bg: #f5f7f7;
  --surface: #ffffff;
  --text: #15201f;
  --muted: #5d6b6a;
  --line: #dde4e3;
  --brand: #0f766e;
  --brand-ink: #ffffff;
  --brand-soft: #e2f3f1;
  --danger: #b42318;
  --warn: #b54708;
  --ok: #067647;
  --pending-bg: #fef0c7; --pending-fg: #93370d;
  --bad-bg: #fee4e2; --bad-fg: #912018;
  --good-bg: #dcfae6; --good-fg: #085d3a;
  --cold-bg: #e0f2fe; --cold-fg: #075985;
  --toast-bg: #15201f; --toast-fg: #ffffff;
  --radius: 10px;
  font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
}
:lang(ar) body { line-height: 1.6; }
bdi[dir="ltr"] { unicode-bidi: isolate; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172120; --text: #e6eeed; --muted: #95a6a4; --line: #2a3735;
    --brand: #2bb3a6; --brand-ink: #062522; --brand-soft: #173a37; --danger: #f97066; --warn: #fdb022; --ok: #47cd89;
    --pending-bg: #4a2a0a; --pending-fg: #fec84b; --bad-bg: #55160c; --bad-fg: #fda29b;
    --good-bg: #053321; --good-fg: #75e0a7; --cold-bg: #0b2a3d; --cold-fg: #7cd4fd;
    --toast-bg: #e6eeed; --toast-fg: #0f1514;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f1514; --surface: #172120; --text: #e6eeed; --muted: #95a6a4; --line: #2a3735;
  --brand: #2bb3a6; --brand-ink: #062522; --brand-soft: #173a37; --danger: #f97066; --warn: #fdb022; --ok: #47cd89;
  --pending-bg: #4a2a0a; --pending-fg: #fec84b; --bad-bg: #55160c; --bad-fg: #fda29b;
  --good-bg: #053321; --good-fg: #75e0a7; --cold-bg: #0b2a3d; --cold-fg: #7cd4fd;
  --toast-bg: #e6eeed; --toast-fg: #0f1514;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; }
a { color: var(--brand); }
h1 { font-size: 1.35rem; margin: 0 0 1rem; }
h2 { font-size: 1.05rem; margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding-block: .6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .4rem; font-weight: 700; font-size: 1.15rem; text-decoration: none; color: var(--brand); }
.nav { display: flex; gap: .25rem; flex: 1; flex-wrap: wrap; }
.nav a { padding: .4rem .7rem; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; }
.nav a.active { background: var(--brand-soft); color: var(--brand); }
.who { display: flex; align-items: center; gap: .5rem; font-size: .9rem; }

.view { max-width: 1100px; margin: 0 auto; padding-block: 1.25rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; }
.stack > * + * { margin-top: .75rem; }
.row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

button, .btn {
  font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  padding: .5rem .9rem; border-radius: 8px; font-weight: 500;
}
button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.danger { color: var(--danger); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link { border: 0; background: none; color: var(--brand); padding: 0; }

input, select, textarea {
  font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: .5rem .65rem; width: 100%;
}
label { display: block; font-size: .85rem; color: var(--muted); }
label > input, label > select, label > textarea { margin-top: .25rem; }
.form-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.qty { width: 5.5rem; }

.product .name { font-weight: 600; }
.price { font-weight: 700; }
.tag { display: inline-block; font-size: .75rem; padding: .1rem .45rem; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.tag.cold { background: var(--cold-bg); color: var(--cold-fg); }

.status { display: inline-block; font-size: .78rem; font-weight: 600; padding: .15rem .55rem; border-radius: 99px; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.status.placed { background: var(--pending-bg); color: var(--pending-fg); }
.status.rejected, .status.cancelled { background: var(--bad-bg); color: var(--bad-fg); }
.status.delivered { background: var(--good-bg); color: var(--good-fg); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: start; padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--bg); }

.tabs { display: flex; gap: .25rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tabs button { border-radius: 99px; }
.tabs button.on { background: var(--text); color: var(--surface); border-color: var(--text); }

.timeline { list-style: none; padding: 0; margin: 0; }
.timeline li { position: relative; padding-block: 0 .9rem; padding-inline: 1.4rem 0; }
.timeline li::before { content: ""; position: absolute; inset-inline-start: .3rem; top: .4rem; width: .55rem; height: .55rem; border-radius: 50%; background: var(--brand); }
.timeline li::after { content: ""; position: absolute; inset-inline-start: .55rem; top: 1rem; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }

.code { direction: ltr; text-align: start; font-family: ui-monospace, monospace; font-size: 2rem; letter-spacing: .3em; font-weight: 700; color: var(--brand); }
.callout { border-inline-start: 4px solid var(--brand); background: var(--brand-soft); padding: .75rem 1rem; border-radius: 8px; }
.banner { background: var(--pending-bg); color: var(--pending-fg); padding: .75rem 1rem; border-radius: 8px; }

.auth { max-width: 460px; margin: 2rem auto; }
.demo button { font-size: .85rem; }
.cart-badge { background: var(--brand); color: var(--brand-ink); border-radius: 99px; padding: 0 .45rem; font-size: .75rem; margin-inline-start: .25rem; }
.empty { text-align: center; padding: 2rem 1rem; color: var(--muted); }

.toast {
  position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(150%);
  background: var(--toast-bg); color: var(--toast-fg); padding: .65rem 1rem; border-radius: 8px;
  max-width: calc(100% - 32px); opacity: 0; visibility: hidden; transition: transform .2s, opacity .2s, visibility .2s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
.toast.error { background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--danger); }

@media (max-width: 640px) {
  .topbar { gap: .5rem; }
  .nav { order: 3; flex-basis: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .who { margin-inline-start: auto; }
  .who .name { display: none; }
}

/* Demo guide (standalone demo only) */
.guide { background: var(--brand-soft); border-bottom: 1px solid var(--line); }
.guide-inner { max-width: 1100px; margin: 0 auto; padding-block: .75rem; display: grid; gap: .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.steps li { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; min-width: 0; }
.steps .num { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center;
  font-size: .8rem; font-weight: 700; background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.steps .txt { flex: 1 1 14rem; min-width: 0; }
.steps li.done { color: var(--muted); }
.steps li.done .num { background: var(--good-bg); color: var(--good-fg); border-color: transparent; }
.steps li.current .num { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.steps li.current .txt { font-weight: 600; }
.code-inline { font-family: ui-monospace, monospace; font-weight: 700; letter-spacing: .1em; color: var(--brand); }
.small-btn { padding: .3rem .7rem; font-size: .85rem; }
.guide-done { background: var(--good-bg); color: var(--good-fg); padding: .5rem .75rem; border-radius: 8px; }
.switch { display: flex; gap: .4rem; align-items: center; overflow-x: auto; padding-bottom: 2px; }
.switch > span { flex: none; white-space: nowrap; }
.switch .chip { flex: none; border-radius: 99px; padding: .3rem .8rem; font-size: .85rem; }
.switch .chip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.hint { outline: 3px solid var(--warn); outline-offset: 3px; animation: hint-pulse 1.4s ease-in-out infinite; }
@keyframes hint-pulse { 50% { outline-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .hint { animation: none; } }

/* ---------- v3: ordering flow, payments, import ---------- */
a.btn { display: inline-flex; align-items: center; text-decoration: none; color: var(--text); }
a.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.big { padding: .75rem 1.2rem; font-size: 1.02rem; width: 100%; }
.err { color: var(--danger); }
.warn-text { color: var(--warn); }
.pre { white-space: pre-line; }
.plain { list-style: none; padding: 0; margin: .25rem 0 0; display: grid; gap: .2rem; }
.search { margin-bottom: .75rem; font-size: 1rem; padding: .65rem .8rem; }
.check { display: flex; align-items: flex-start; gap: .5rem; color: inherit; font-size: .95rem; }
.check input[type=checkbox], .check input[type=radio] { width: auto; margin-top: .25rem; flex: none; }
input.num { width: 4.5rem; display: inline-block; padding: .3rem .45rem; }
input.num.wide { width: 6.5rem; }
details summary { cursor: pointer; padding-block: .25rem; }
.codeblock { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: .75rem; overflow-x: auto; font-size: .8rem; text-align: left; }
code.key { background: var(--bg); padding: .35rem .5rem; border-radius: 6px; word-break: break-all; font-size: .85rem; }

/* step indicator for a new order */
.wizard { list-style: none; padding: 0; margin: 0 0 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.wizard li { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .9rem; }
.wizard li + li::before { content: ""; width: 1.25rem; height: 1px; background: var(--line); }
.wizard a { display: flex; align-items: center; gap: .4rem; color: inherit; text-decoration: none; }
.wizard .num { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; border: 1px solid var(--line); background: var(--surface); }
.wizard li.current { color: var(--text); font-weight: 600; }
.wizard li.current .num { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.wizard li.done .num { background: var(--good-bg); color: var(--good-fg); border-color: transparent; }

/* choose a company */
.supplier-list { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.supplier-card { display: grid; gap: .45rem; text-decoration: none; color: inherit; transition: border-color .15s; }
.supplier-card:hover, .supplier-card:focus-visible { border-color: var(--brand); }
.supplier-name { font-size: 1.08rem; }
.supplier-card .go { color: var(--brand); font-weight: 600; font-size: .9rem; }

/* company catalogue */
.shop-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: .75rem; }
.shop-head h1 { margin-bottom: .35rem; }
.chips { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .5rem; margin-bottom: .5rem; }
.chip { flex: none; border-radius: 99px; padding: .3rem .8rem; font-size: .85rem; }
.chip.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.product-list { display: grid; gap: .5rem; padding-bottom: 6rem; }
.prow { display: flex; align-items: center; gap: .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem .85rem; }
.prow.in { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.pinfo { flex: 1; min-width: 0; display: grid; gap: .15rem; }
.pqty { flex: none; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; border-radius: 0; width: 2.6rem; height: 2.6rem; font-size: 1.25rem; padding: 0; background: var(--brand-soft); color: var(--brand); }
.stepper input { width: 3.6rem; border: 0; border-radius: 0; text-align: center; font-weight: 700; font-size: 1rem; background: var(--surface); padding: .4rem 0; }
.cartbar { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 20px rgb(0 0 0 / .08); padding-bottom: env(safe-area-inset-bottom, 0px); }
.cartbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: .7rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cartbar-inner button { padding: .7rem 1.2rem; font-size: 1rem; white-space: nowrap; flex: none; }

/* checkout */
.checkout { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.totals { display: grid; gap: .35rem; border-top: 1px solid var(--line); padding-top: .6rem; }
.totals .grand { font-size: 1.1rem; }
fieldset.pay-options { border: 1px solid var(--line); margin: 0; min-width: 0; }
fieldset.pay-options legend { padding: 0; float: left; width: 100%; }
fieldset.pay-options legend + * { clear: both; }
.pay-option { display: flex; gap: .65rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: .75rem; cursor: pointer; color: var(--text); font-size: .95rem; }
.pay-option > span { display: grid; gap: .2rem; }
.pay-option input { width: auto; margin-top: .3rem; flex: none; }
.pay-option:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.pay-option.disabled { opacity: .7; cursor: not-allowed; }

/* orders */
.order-list { display: grid; gap: .6rem; }
.order-card { display: grid; gap: .4rem; text-decoration: none; color: inherit; }
.order-card:hover { border-color: var(--brand); }
.progress { list-style: none; padding: 0; margin: 0 0 1rem; display: grid; grid-template-columns: repeat(5, 1fr); gap: .25rem; }
.progress li { display: grid; justify-items: center; gap: .3rem; font-size: .78rem; color: var(--muted); text-align: center; position: relative; }
.progress li::after { content: ""; position: absolute; top: .45rem; inset-inline-start: calc(50% + .6rem); width: calc(100% - 1.2rem); height: 2px; background: var(--line); }
.progress li:last-child::after { display: none; }
.progress .dot { width: .95rem; height: .95rem; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); position: relative; z-index: 1; }
.progress li.done { color: var(--text); }
.progress li.done .dot { background: var(--brand); border-color: var(--brand); }
.progress li.done::after { background: var(--brand); }
.progress li.current { color: var(--brand); font-weight: 600; }
.progress li.current .dot { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; margin: 0; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: end; font-variant-numeric: tabular-nums; }
.pay-form { border-top: 1px solid var(--line); padding-top: .75rem; }
.actions { align-items: center; }

/* numbers at a glance */
.tiles { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.tile { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .55rem .7rem; display: grid; gap: .1rem; }
.tile span { font-size: .78rem; color: var(--muted); }
.tile strong { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.tile.bad { border-color: var(--danger); }
.tile.bad strong { color: var(--danger); }

/* import */
.import-grid { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; margin-bottom: 1rem; }
.drop { display: grid; justify-items: center; gap: .3rem; padding: 1.6rem 1rem; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer; text-align: center; color: var(--text); }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.opt { border: 1px solid var(--line); border-radius: 10px; padding: .7rem; }
.opt > span { display: grid; gap: .3rem; }

@media (max-width: 800px) {
  .checkout, .import-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .prow { flex-wrap: wrap; }
  .pqty { width: 100%; display: flex; justify-content: flex-end; }
  .progress li { font-size: .7rem; }
  .kv { grid-template-columns: 1fr auto; }
}

</style>
</head>

// The web client reads the shared rules as globals.

const OLD_KEYS = ['maa.demo.db', 'maa.demo.db.v2', 'maa.cart'];

// ---------- node:sqlite-style wrapper over sql.js ----------

function wrap(raw) {
  const statement = (sql) => ({
    run(...args) {
      const st = raw.prepare(sql);
      try { st.bind(args); st.step(); } finally { st.free(); }
      return { changes: raw.getRowsModified(), lastInsertRowid: raw.exec('SELECT last_insert_rowid()')[0].values[0][0] };

    get(...args) {
      const st = raw.prepare(sql);
      try { st.bind(args); return st.step() ? st.getAsObject() : undefined; } finally { st.free(); }
    },
    all(...args) {
      const st = raw.prepare(sql);
      const rows = [];
      try { st.bind(args); while (st.step()) rows.push(st.getAsObject()); } finally { st.free(); }
      return rows;
    },
  });

}

const toB64 = (bytes) => {

const fromB64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { /* ignore */ } },
};

// ---------- a tiny Express-compatible router ----------

function createRouter() {
  const routes = [];
  const app = {};
  for (const m of ['get', 'post', 'put', 'patch', 'delete']) {
    app[m] = (path, ...handlers) => {
      const keys = [];
      const re = new RegExp(`^${path.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; })}$`);
      routes.push({ method: m.toUpperCase(), re, keys, handlers });
    };
  }
  const run = (handlers, req, res) => new Promise((resolve, reject) => {
    let i = 0;
    const next = (err) => {
      if (err) return reject(err);
      if (res.sent) return resolve();
      const h = handlers[i++];
      if (!h) return resolve();
      try {
        const out = h(req, res, next);
        if (out && typeof out.then === 'function') out.then(() => res.sent && resolve(), reject);
        else if (res.sent) resolve();
      } catch (e) { reject(e); }
    };
    next();
  });
  const match = (method, path) => {
    for (const r of routes) {
      if (r.method !== method) continue;
      const m = r.re.exec(path);
      if (m) return { route: r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };
    }
    return null;
  };
  return { app, run, match };
}

// ---------- boot ----------

let db = null;
let raw = null;
const router = createRouter();

function save() {
  if (!raw) return;
  const ok = storage.set(STORE_KEY, toB64(raw.export()));
  raw.exec('PRAGMA foreign_keys = ON'); // export() reopens the database and resets pragmas
  if (!ok) console.warn('Maa demo: browser storage is full or blocked; changes last until the page is closed.');
}

const ready = (async () => {
  if (typeof initSqlJs !== 'function') throw new Error('sql.js did not load');
  const SQL = await initSqlJs();
  OLD_KEYS.forEach(storage.del);
  const saved = storage.get(STORE_KEY);
  try {
    raw = saved ? new SQL.Database(fromB64(saved)) : new SQL.Database();
    db = wrap(raw);
    applySchema(db);
  } catch {
    raw = new SQL.Database(); // unreadable or outdated save: start over
    db = wrap(raw);
    applySchema(db);
  }
  if (seed(db)) save();
  const ctx = { db, secret: 'demo', ...CONFIG };
  router.attachUser = attachUser(ctx, verifyToken);
  registerRoutes(router.app, ctx);
})();

ready.catch((e) => {
  console.error(e);
  const view = document.getElementById('view');
  if (view) {
    view.innerHTML = '<div class="card">تعذّر تشغيل النسخة التجريبية لأن مكتبة قاعدة البيانات لم تُحمَّل. تحقّق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.<br><span class="small muted">The demo database library did not load. Check the internet connection and reload.</span></div>';
  }
});

async function handle(method, url, headers, bodyText) {
  const reply = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'content-type': 'application/json' } });
  try { await ready; } catch { return reply(503, { error: 'Demo database is not available' }); }
  if (url.pathname === '/api/config') return reply(200, CONFIG);

  let body;
  if (bodyText) {
    try { body = JSON.parse(bodyText); } catch { return reply(400, { error: 'Invalid JSON' }); }
  }
  const req = {
    method, path: url.pathname, body, params: {},
    query: Object.fromEntries(url.searchParams),
    get: (name) => headers.get(name),
  };
  const res = {
    statusCode: 200, sent: false, payload: undefined,
    status(code) { this.statusCode = code; return this; },
    json(obj) { this.payload = obj; this.sent = true; return this; },
  };
  try {
    await router.run([router.attachUser], req, res);
    const found = router.match(method, url.pathname);
    if (!found) throw new HttpError(404, 'Not found');
    req.params = found.params;
    await router.run(found.route.handlers, req, res);
    if (!res.sent) throw new Error(`No response from ${method} ${url.pathname}`);
    if (method !== 'GET') save();
    return reply(res.statusCode, res.payload);
  } catch (err) {
    if (!err.status) console.error(err);
    const { status, body: errBody } = errorBody(err);
    return reply(status, errBody);
  }
}

const realFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href);
  if (!url.pathname.startsWith('/api/')) return realFetch(input, init);
  return handle((init.method || 'GET').toUpperCase(), url, new Headers(init.headers || {}), init.body);
};

// ---------- hooks for the guide in app.js ----------

const TERMINAL = "('delivered', 'rejected', 'cancelled')";
window.maaDemo = {
  password: DEMO_PASSWORD,
  accounts: [
    { email: 'pharmacy@maa.test', label: 'Pharmacy' },
    { email: 'supplier@maa.test', label: 'Al Wadi (supplier)' },
    { email: 'supplier2@maa.test', label: 'Sahara (supplier)' },
    { email: 'driver@maa.test', label: 'Driver' },
    { email: 'admin@maa.test', label: 'Admin' },
  ],
  /** How far the oldest open order has got (or the newest delivered one). */
  progress() {
    if (!db) return { state: 'start', order: null };
    const pick = `SELECT o.id, o.status, o.delivery_code AS code, o.upfront_required, o.paid_amount,
      (SELECT email FROM users u WHERE u.org_id = o.supplier_id AND u.role = 'supplier' ORDER BY u.id LIMIT 1) AS supplierEmail FROM orders o`;
    const active = db.prepare(`${pick} WHERE o.status NOT IN ${TERMINAL} ORDER BY o.id LIMIT 1`).get();
    if (active) return { state: 'active', order: active };
    const last = db.prepare(`${pick} ORDER BY o.id DESC LIMIT 1`).get();
    if (last && last.status === 'delivered') return { state: 'done', order: last };
    return { state: 'start', order: null };
  },
};

window.maaResetDemo = () => {
  [STORE_KEY, 'maa.token', 'maa.drafts', 'maa.tabs'].forEach(storage.del);

  location.reload();

"standalone/auth-browser": function (module, exports, require) {
'use strict';
/*
 * Stand-in for src/auth.js inside the browser demo, where Node's crypto module
 * does not exist. Same function names; deliberately simple because demo data
 * never leaves the visitor's own browser. Never use this on a server.
 */
const rand = (bytes) => Array.from(crypto.getRandomValues(new Uint8Array(bytes)), (b) => b.toString(16).padStart(2, '0')).join('');

module.exports = {
  hashPassword: (pw) => `demo$${pw}`,
  verifyPassword: (pw, stored) => stored === `demo$${pw}`,
  signToken: (payload) => btoa(JSON.stringify(payload)),
  verifyToken: (token) => { try { return JSON.parse(atob(token)); } catch { return null; } },
  deliveryCode: () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 1_000_000).padStart(6, '0'),
  generateApiKey: () => `maa_${rand(24)}`,
  hashApiKey: (key) => `demo$${key}`,
};

"src/http": function (module, exports, require) {
'use strict';
/* Request plumbing with no Express dependency, so the same route code also runs in the browser demo. */

class HttpError extends Error {
  constructor(status, message, details) {
    super(message);
    this.status = status;
    if (details) this.details = details;
  }
}

/** Middleware: read the bearer token and attach the signed-in user (if any) to req.user. */
function attachUser({ db, secret }, verifyToken) {
  return (req, _res, next) => {
    const header = (req.get && req.get('authorization')) || '';
    const token = header.startsWith('Bearer ') ? header.slice(7) : null;
    const payload = token && verifyToken(token, secret);
    if (payload) {
      const user = db.prepare(`
        SELECT u.id, u.name, u.email, u.phone, u.role, u.org_id, u.vehicle, u.approved, o.verified AS org_verified
          FROM users u LEFT JOIN organizations o ON o.id = u.org_id WHERE u.id = ?`).get(payload.uid);
      if (user) req.user = user;
    }
    next();
  };
}

/** Middleware: require a signed-in, approved user with one of the given roles. */
function requireRole(...roles) {
  return (req, _res, next) => {
    if (!req.user) return next(new HttpError(401, 'Login required'));
    if (roles.length && !roles.includes(req.user.role)) return next(new HttpError(403, 'Not allowed for your role'));
    if (!req.user.approved) return next(new HttpError(403, 'Your account is awaiting approval'));
    if (req.user.org_id && !req.user.org_verified) return next(new HttpError(403, 'Your organization is awaiting license verification'));
    next();
  };
}

/** Error body shared by both runtimes. */
function errorBody(err) {
  const status = err.status || 500;
  return { status, body: { error: status >= 500 ? 'Internal server error' : err.message, ...(err.details && { details: err.details }) } };
}

module.exports = { HttpError, attachUser, requireRole, errorBody };

},
"src/store": function (module, exports, require) {
'use strict';
/* Database schema and transaction helper. No Node-only APIs: also used by the browser demo. */

const SCHEMA_VERSION = 2;

const SCHEMA = `
PRAGMA foreign_keys = ON;

CREATE TABLE IF NOT EXISTS organizations (
  id            INTEGER PRIMARY KEY AUTOINCREMENT,
  type          TEXT NOT NULL CHECK (type IN ('pharmacy','supplier')),
  name          TEXT NOT NULL,
  license_no    TEXT NOT NULL,
  address       TEXT NOT NULL,
  city          TEXT,
  phone         TEXT,
  verified      INTEGER NOT NULL DEFAULT 0,
  -- supplier terms of sale (ignored for pharmacies)
  allow_full       INTEGER NOT NULL DEFAULT 1,
  allow_partial    INTEGER NOT NULL DEFAULT 0,
  deposit_percent  INTEGER NOT NULL DEFAULT 30 CHECK (deposit_percent BETWEEN 1 AND 99),
  allow_credit     INTEGER NOT NULL DEFAULT 0,
  credit_days      INTEGER NOT NULL DEFAULT 30 CHECK (credit_days BETWEEN 1 AND 365),
  credit_limit     INTEGER NOT NULL DEFAULT 0 CHECK (credit_limit >= 0),   -- per pharmacy, minor units
  min_order_value  INTEGER NOT NULL DEFAULT 0 CHECK (min_order_value >= 0),
  bank_details     TEXT,
  products_updated_at TEXT,
  created_at    TEXT NOT NULL DEFAULT (datetime('now'))
);

CREATE TABLE IF NOT EXISTS users (
  id            INTEGER PRIMARY KEY AUTOINCREMENT,
  name          TEXT NOT NULL,
  email         TEXT NOT NULL UNIQUE COLLATE NOCASE,
  phone         TEXT,
  password_hash TEXT NOT NULL,
  role          TEXT NOT NULL CHECK (role IN ('pharmacy','supplier','driver','admin')),
  org_id        INTEGER REFERENCES organizations(id),
  vehicle       TEXT,
  approved      INTEGER NOT NULL DEFAULT 1,     -- drivers need admin approval
  created_at    TEXT NOT NULL DEFAULT (datetime('now'))
);

CREATE TABLE IF NOT EXISTS products (
  id            INTEGER PRIMARY KEY AUTOINCREMENT,
  supplier_id   INTEGER NOT NULL REFERENCES organizations(id),
  name          TEXT NOT NULL,
  generic_name  TEXT,
  category      TEXT,
  form          TEXT,
  strength      TEXT,
  pack_size     TEXT,
  sku           TEXT NOT NULL,                    -- the company's own product code; imports match on it
  price         INTEGER NOT NULL CHECK (price >= 0),      -- minor units (cents)
  stock         INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
  min_order_qty INTEGER NOT NULL DEFAULT 1 CHECK (min_order_qty >= 1),
  cold_chain    INTEGER NOT NULL DEFAULT 0,
  active        INTEGER NOT NULL DEFAULT 1,
  created_at    TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE INDEX IF NOT EXISTS idx_products_supplier ON products(supplier_id);
CREATE UNIQUE INDEX IF NOT EXISTS idx_products_sku ON products(supplier_id, sku);

CREATE TABLE IF NOT EXISTS orders (
  id               INTEGER PRIMARY KEY AUTOINCREMENT,
  pharmacy_id      INTEGER NOT NULL REFERENCES organizations(id),
  supplier_id      INTEGER NOT NULL REFERENCES organizations(id),
  placed_by        INTEGER NOT NULL REFERENCES users(id),
  status           TEXT NOT NULL,
  subtotal         INTEGER NOT NULL,
  delivery_fee     INTEGER NOT NULL,
  total            INTEGER NOT NULL,
  payment_terms    TEXT NOT NULL CHECK (payment_terms IN ('full','partial','credit')),
  upfront_required INTEGER NOT NULL,              -- must be paid before dispatch
  paid_amount      INTEGER NOT NULL DEFAULT 0,    -- confirmed by the supplier
  payment_reference TEXT,                         -- transfer receipt no. given by the pharmacy
  credit_days      INTEGER,
  due_date         TEXT,                          -- credit: set on delivery
  notes            TEXT,
  delivery_address TEXT NOT NULL,
  delivery_code    TEXT NOT NULL,
  driver_id        INTEGER REFERENCES users(id),
  created_at       TEXT NOT NULL DEFAULT (datetime('now')),
  updated_at       TEXT NOT NULL DEFAULT (datetime('now'))
);
CREATE INDEX IF NOT EXISTS idx_orders_pharmacy ON orders(pharmacy_id);
CREATE INDEX IF NOT EXISTS idx_orders_supplier ON orders(supplier_id);
CREATE INDEX IF NOT EXISTS idx_orders_driver   ON orders(driver_id);
CREATE INDEX IF NOT EXISTS idx_orders_status   ON orders(status);

CREATE TABLE IF NOT EXISTS order_items (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  order_id    INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
  product_id  INTEGER NOT NULL REFERENCES products(id),
  name        TEXT NOT NULL,
  unit_price  INTEGER NOT NULL,
  qty         INTEGER NOT NULL CHECK (qty > 0),
  line_total  INTEGER NOT NULL
);

CREATE TABLE IF NOT EXISTS order_payments (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  order_id    INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
  amount      INTEGER NOT NULL CHECK (amount > 0),
  method      TEXT NOT NULL CHECK (method IN ('bank_transfer','cash','card','cheque','other')),
  reference   TEXT,
  recorded_by INTEGER REFERENCES users(id),
  created_at  TEXT NOT NULL DEFAULT (datetime('now'))
);

CREATE TABLE IF NOT EXISTS api_keys (
  id           INTEGER PRIMARY KEY AUTOINCREMENT,
  org_id       INTEGER NOT NULL REFERENCES organizations(id),
  prefix       TEXT NOT NULL,                     -- first characters, shown so people can tell keys apart
  key_hash     TEXT NOT NULL UNIQUE,
  label        TEXT,
  created_at   TEXT NOT NULL DEFAULT (datetime('now')),
  last_used_at TEXT,
  revoked_at   TEXT
);

CREATE TABLE IF NOT EXISTS product_imports (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  org_id      INTEGER NOT NULL REFERENCES organizations(id),
  source      TEXT NOT NULL CHECK (source IN ('excel','api')),
  file_name   TEXT,
  created     INTEGER NOT NULL,
  updated     INTEGER NOT NULL,
  unchanged   INTEGER NOT NULL,
  hidden      INTEGER NOT NULL,
  actor_id    INTEGER REFERENCES users(id),
  created_at  TEXT NOT NULL DEFAULT (datetime('now'))
);

CREATE TABLE IF NOT EXISTS order_events (
  id          INTEGER PRIMARY KEY AUTOINCREMENT,
  order_id    INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
  status      TEXT NOT NULL,
  note        TEXT,
  actor_id    INTEGER REFERENCES users(id),
  created_at  TEXT NOT NULL DEFAULT (datetime('now'))
);
`;

/** Create tables on a new database; refuse an old one instead of corrupting it. */
function applySchema(db) {
  const version = db.prepare('PRAGMA user_version').get().user_version;
  const hasTables = db.prepare("SELECT COUNT(*) AS n FROM sqlite_master WHERE type = 'table' AND name = 'orders'").get().n > 0;
  if (hasTables && version < SCHEMA_VERSION) {
    throw new Error('This database was made by an older version of Maa. Delete the data file (DB_FILE, default data/maa.db) and run "npm run seed" again.');
  }
  db.exec(SCHEMA);
  db.exec(`PRAGMA user_version = ${SCHEMA_VERSION}`);
}

/** Run fn inside a transaction; rolls back on throw. */
function tx(db, fn) {
  db.exec('BEGIN IMMEDIATE');
  try {
    const out = fn();
    db.exec('COMMIT');
    return out;
  } catch (err) {
    db.exec('ROLLBACK');
    throw err;
  }
}

module.exports = { applySchema, tx, SCHEMA_VERSION };

},
"src/validate": function (module, exports, require) {
'use strict';
const { HttpError } = require('./http');

function str(v, field, { required = true, max = 200 } = {}) {
  if (v === undefined || v === null || v === '') {
    if (required) throw new HttpError(400, `${field} is required`);
    return null;
  }
  if (typeof v !== 'string') throw new HttpError(400, `${field} must be text`);
  const t = v.trim();
  if (required && !t) throw new HttpError(400, `${field} is required`);
  if (t.length > max) throw new HttpError(400, `${field} is too long`);
  return t || null;
}

function int(v, field, { min = 0, max = Number.MAX_SAFE_INTEGER, required = true } = {}) {
  if (v === undefined || v === null || v === '') {
    if (required) throw new HttpError(400, `${field} is required`);
    return null;
  }
  const n = Number(v);
  if (!Number.isInteger(n) || n < min || n > max) throw new HttpError(400, `${field} must be a whole number between ${min} and ${max}`);
  return n;
}

/** Accept a price in major units (e.g. 12.5) and return minor units (1250). */
function money(v, field) {
  const n = Number(v);
  if (v === '' || v === null || v === undefined || !Number.isFinite(n) || n < 0 || n > 10_000_000) {
    throw new HttpError(400, `${field} must be a positive amount`);
  }
  return Math.round(n * 100);
}

function email(v) {
  const e = str(v, 'email', { max: 254 }).toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)) throw new HttpError(400, 'email is invalid');
  return e;
}

module.exports = { str, int, money, email };

},
"src/policy": function (module, exports, require) {
'use strict';
/* A supplier's terms of sale, and how much open credit a pharmacy already has with it. */

const POLICY_COLS = 'allow_full, allow_partial, deposit_percent, allow_credit, credit_days, credit_limit, min_order_value, bank_details';

function shapePolicy(o) {
  return {
    allow_full: !!o.allow_full, allow_partial: !!o.allow_partial, deposit_percent: o.deposit_percent,
    allow_credit: !!o.allow_credit, credit_days: o.credit_days, credit_limit: o.credit_limit,
    min_order_value: o.min_order_value, bank_details: o.bank_details || null,
  };
}

function getPolicy(db, supplierId) {
  const o = db.prepare(`SELECT ${POLICY_COLS} FROM organizations WHERE id = ? AND type = 'supplier'`).get(supplierId);
  return o ? shapePolicy(o) : null;
}

/** Unpaid balance of the pharmacy's live credit orders with this supplier. */
function creditOutstanding(db, pharmacyId, supplierId) {
  return db.prepare(`
    SELECT COALESCE(SUM(total - paid_amount), 0) AS n FROM orders
     WHERE pharmacy_id = ? AND supplier_id = ? AND payment_terms = 'credit'
       AND status NOT IN ('rejected', 'cancelled') AND paid_amount < total`).get(pharmacyId, supplierId).n;
}

module.exports = { POLICY_COLS, shapePolicy, getPolicy, creditOutstanding };

},

"src/routes/auth": function (module, exports, require) {
'use strict';
const { HttpError } = require('../http');
const { hashPassword, verifyPassword, signToken } = require('../auth');
const { tx } = require('../store');
const v = require('../validate');

module.exports = (app, { db, secret }) => {
  const publicUser = (u) => {
    const org = u.org_id ? db.prepare('SELECT * FROM organizations WHERE id = ?').get(u.org_id) : null;
    return {
      id: u.id, name: u.name, email: u.email, phone: u.phone, role: u.role,
      vehicle: u.vehicle, approved: !!u.approved,
      organization: org && { ...org, verified: !!org.verified },
    };
  };

  /**
   * Register a pharmacy, a supplier company, or a driver.
   * Pharmacies/suppliers create their organization at the same time and
   * must be verified by an admin before they can trade. Drivers must be approved.
   */
  app.post('/api/auth/register', (req, res) => {
    const b = req.body || {};
    const role = b.role;
    if (!['pharmacy', 'supplier', 'driver'].includes(role)) throw new HttpError(400, 'role must be pharmacy, supplier or driver');
    const name = v.str(b.name, 'name', { max: 100 });
    const email = v.email(b.email);
    const phone = v.str(b.phone, 'phone', { max: 30 });
    const password = v.str(b.password, 'password', { max: 200 });
    if (password.length < 8) throw new HttpError(400, 'password must be at least 8 characters');

    if (db.prepare('SELECT 1 FROM users WHERE email = ?').get(email)) throw new HttpError(409, 'An account with this email already exists');

    const user = tx(db, () => {
      let orgId = null;
      if (role !== 'driver') {
        const o = b.organization || {};
        const r = db.prepare(
          'INSERT INTO organizations (type, name, license_no, address, city, phone) VALUES (?, ?, ?, ?, ?, ?)'
        ).run(
          role,
          v.str(o.name, 'organization.name', { max: 150 }),
          v.str(o.license_no, 'organization.license_no', { max: 60 }),
          v.str(o.address, 'organization.address', { max: 300 }),
          v.str(o.city, 'organization.city', { required: false, max: 80 }),
          phone,
        );
        orgId = Number(r.lastInsertRowid);
      }
      const r = db.prepare(
        'INSERT INTO users (name, email, phone, password_hash, role, org_id, vehicle, approved) VALUES (?, ?, ?, ?, ?, ?, ?, ?)'
      ).run(name, email, phone, hashPassword(password), role, orgId,
        role === 'driver' ? v.str(b.vehicle, 'vehicle', { required: false, max: 80 }) : null,
        role === 'driver' ? 0 : 1);
      return db.prepare('SELECT * FROM users WHERE id = ?').get(r.lastInsertRowid);
    });

    res.status(201).json({ token: signToken({ uid: user.id }, secret), user: publicUser(user) });
  });

  app.post('/api/auth/login', (req, res) => {
    const email = v.email(req.body?.email);
    const password = v.str(req.body?.password, 'password');
    const user = db.prepare('SELECT * FROM users WHERE email = ?').get(email);
    if (!user || !verifyPassword(password, user.password_hash)) throw new HttpError(401, 'Wrong email or password');
    res.json({ token: signToken({ uid: user.id }, secret), user: publicUser(user) });
  });

  // Not using requireRole() here: unapproved users still need to see their own status.
  app.get('/api/me', (req, res) => {
    if (!req.user) throw new HttpError(401, 'Login required');
    res.json({ user: publicUser(req.user) });
  });
};

},
"src/routes/catalog": function (module, exports, require) {
'use strict';
const { HttpError, requireRole } = require('../http');
const { POLICY_COLS, shapePolicy, creditOutstanding } = require('../policy');
const v = require('../validate');

const PRODUCT_COLS = `p.id, p.supplier_id, p.name, p.generic_name, p.category, p.form, p.strength, p.pack_size,
  p.sku, p.price, p.stock, p.min_order_qty, p.cold_chain, p.active`;
const shapeProduct = (p) => ({ ...p, cold_chain: !!p.cold_chain, active: !!p.active });

/** What pharmacies see: verified companies, their terms, and their products. */
module.exports = (app, { db }) => {
  const supplierRow = (id) => db.prepare(`
    SELECT o.id, o.name, o.city, o.address, o.phone, o.products_updated_at, ${POLICY_COLS},
           (SELECT COUNT(*) FROM products p WHERE p.supplier_id = o.id AND p.active = 1) AS product_count
      FROM organizations o WHERE o.type = 'supplier' AND o.verified = 1 ${id ? 'AND o.id = ?' : ''} ORDER BY o.name`);

  const shapeSupplier = (o, pharmacyId) => {
    const { allow_full, allow_partial, deposit_percent, allow_credit, credit_days, credit_limit, min_order_value, bank_details, ...rest } = o;
    const policy = shapePolicy(o);
    const out = { ...rest, policy };
    if (pharmacyId && policy.allow_credit) {
      const outstanding = creditOutstanding(db, pharmacyId, o.id);
      out.credit = { limit: policy.credit_limit, outstanding, remaining: Math.max(0, policy.credit_limit - outstanding) };
    }
    return out;
  };

  app.get('/api/suppliers', requireRole('pharmacy', 'admin'), (req, res) => {
    const pid = req.user.role === 'pharmacy' ? req.user.org_id : null;
    res.json({ suppliers: supplierRow(false).all().map((o) => shapeSupplier(o, pid)) });
  });

  app.get('/api/suppliers/:id', requireRole('pharmacy', 'admin'), (req, res) => {
    const o = supplierRow(true).get(v.int(req.params.id, 'id', { min: 1 }));
    if (!o) throw new HttpError(404, 'Supplier not found');
    const pid = req.user.role === 'pharmacy' ? req.user.org_id : null;
    const products = db.prepare(`SELECT ${PRODUCT_COLS} FROM products p WHERE p.supplier_id = ? AND p.active = 1 ORDER BY p.name, p.strength`).all(o.id);
    res.json({ supplier: shapeSupplier(o, pid), products: products.map(shapeProduct) });
  });

  /** Search across all verified suppliers (used to compare prices). */
  app.get('/api/products', requireRole('pharmacy', 'admin'), (req, res) => {
    const where = ['p.active = 1', 'o.verified = 1'];
    const args = [];
    const q = typeof req.query.q === 'string' ? req.query.q.trim() : '';
    if (q) {
      where.push("(p.name LIKE ?1 ESCAPE '\\' OR p.generic_name LIKE ?1 ESCAPE '\\' OR p.sku LIKE ?1 ESCAPE '\\')");
      args.push(`%${q.replace(/[%_\\]/g, (c) => '\\' + c)}%`);
    }
    if (req.query.supplier) {
      where.push('p.supplier_id = ?');
      args.push(v.int(req.query.supplier, 'supplier', { min: 1 }));
    }
    const rows = db.prepare(`
      SELECT ${PRODUCT_COLS}, o.name AS supplier_name
        FROM products p JOIN organizations o ON o.id = p.supplier_id
       WHERE ${where.join(' AND ')} ORDER BY p.name LIMIT 200`).all(...args);
    res.json({ products: rows.map(shapeProduct) });
  });
};

module.exports.PRODUCT_COLS = PRODUCT_COLS;
module.exports.shapeProduct = shapeProduct;

},
"src/routes/supplier": function (module, exports, require) {
'use strict';
const { HttpError, requireRole } = require('../http');
const { generateApiKey, hashApiKey } = require('../auth');
const { getPolicy } = require('../policy');
const { tx } = require('../store');
const { normalizeProducts, planSync } = require('../../shared/import');
const v = require('../validate');
const { PRODUCT_COLS, shapeProduct } = require('./catalog');

const EXISTING_COLS = 'id, sku, name, generic_name, category, form, strength, pack_size, price, stock, min_order_qty, cold_chain, active';
const LIST_LIMIT = 300; // rows of detail returned in a preview; the counts are always complete

/**
 * Apply (or preview) a product list for one company. Shared by the Excel upload
 * and the API. Nothing changes unless every row is valid, or the caller asked to
 * skip the rows with errors.
 */
function runImport(db, orgId, rows, { hideMissing = false, dryRun = true, skipErrors = false, source, fileName = null, actorId = null }) {
  const { products, errors, unknownColumns } = normalizeProducts(rows);
  const existing = db.prepare(`SELECT ${EXISTING_COLS} FROM products WHERE supplier_id = ?`).all(orgId);
  // A file that failed as a whole (no usable columns) must never hide the whole catalog.
  const fatal = errors.some((e) => e.row <= 1);
  const plan = planSync(products, existing, { hideMissing: hideMissing && !fatal && (!errors.length || skipErrors) });
  const summary = { created: plan.create.length, updated: plan.update.length, unchanged: plan.unchanged, hidden: plan.hide.length, errors: errors.length, rows: products.length + errors.length };
  const result = {
    dry_run: dryRun, applied: false, summary, unknown_columns: unknownColumns,
    errors: errors.slice(0, LIST_LIMIT),
    create: plan.create.slice(0, LIST_LIMIT).map(({ row, sku, name, price, stock }) => ({ row, sku, name, price, stock })),
    update: plan.update.slice(0, LIST_LIMIT),
    hide: plan.hide.slice(0, LIST_LIMIT),
  };
  if (dryRun) return result;
  if (fatal || (errors.length && !skipErrors)) {
    throw new HttpError(422, 'The file has errors. Fix them, or choose to skip those rows.', { summary, errors: result.errors });
  }

  const bool = (b) => (b ? 1 : 0);
  tx(db, () => {
    const ins = db.prepare(`INSERT INTO products (supplier_id, sku, name, generic_name, category, form, strength, pack_size, price, stock, min_order_qty, cold_chain, active)
      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`);
    for (const p of plan.create) {
      ins.run(orgId, p.sku, p.name, p.generic_name ?? null, p.category ?? null, p.form ?? null, p.strength ?? null, p.pack_size ?? null,
        p.price, p.stock ?? 0, p.min_order_qty ?? 1, bool(p.cold_chain), p.active === false ? 0 : 1);
    }
    for (const u of plan.update) {
      const cols = Object.keys(u.changes);
      const vals = cols.map((c) => (typeof u.changes[c] === 'boolean' ? bool(u.changes[c]) : u.changes[c]));
      db.prepare(`UPDATE products SET ${cols.map((c) => `${c} = ?`).join(', ')} WHERE id = ? AND supplier_id = ?`).run(...vals, u.id, orgId);
    }
    for (const h of plan.hide) db.prepare('UPDATE products SET active = 0 WHERE id = ? AND supplier_id = ?').run(h.id, orgId);
    db.prepare("UPDATE organizations SET products_updated_at = datetime('now') WHERE id = ?").run(orgId);
    db.prepare('INSERT INTO product_imports (org_id, source, file_name, created, updated, unchanged, hidden, actor_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?)')
      .run(orgId, source, fileName, summary.created, summary.updated, summary.unchanged, summary.hidden, actorId);
  });
  result.applied = true;
  return result;
}

module.exports = (app, { db }) => {
  const supplierOnly = requireRole('supplier');

  // ---------- products ----------

  app.get('/api/supplier/products', supplierOnly, (req, res) => {
    const rows = db.prepare(`SELECT ${PRODUCT_COLS} FROM products p WHERE p.supplier_id = ? ORDER BY p.active DESC, p.name`).all(req.user.org_id);
    const org = db.prepare('SELECT products_updated_at FROM organizations WHERE id = ?').get(req.user.org_id);
    res.json({ products: rows.map(shapeProduct), updated_at: org.products_updated_at });
  });

  const readProduct = (b, partial) => {
    const out = {};
    const take = (key, fn) => { if (partial && b[key] === undefined) return; out[key] = fn(b[key]); };
    take('sku', (x) => v.str(x, 'sku', { max: 60 }));
    take('name', (x) => v.str(x, 'name', { max: 150 }));
    for (const k of ['generic_name', 'category', 'form', 'strength', 'pack_size']) take(k, (x) => v.str(x, k, { required: false, max: 150 }));
    take('price', (x) => v.money(x, 'price'));
    take('stock', (x) => v.int(x ?? 0, 'stock', { min: 0, max: 10_000_000 }));
    take('min_order_qty', (x) => v.int(x ?? 1, 'min_order_qty', { min: 1, max: 100_000 }));
    take('cold_chain', (x) => (x ? 1 : 0));
    take('active', (x) => (x === undefined ? 1 : x ? 1 : 0));
    return out;
  };
  const uniqueSku = (fn) => {
    try { return fn(); } catch (e) {
      if (/UNIQUE/.test(e.message)) throw new HttpError(409, 'Another product already uses this product code');
      throw e;
    }
  };
  const touch = (orgId) => db.prepare("UPDATE organizations SET products_updated_at = datetime('now') WHERE id = ?").run(orgId);

  app.post('/api/supplier/products', supplierOnly, (req, res) => {
    const p = readProduct(req.body || {}, false);
    const cols = Object.keys(p);
    const r = uniqueSku(() => db.prepare(
      `INSERT INTO products (supplier_id, ${cols.join(', ')}) VALUES (?, ${cols.map(() => '?').join(', ')})`,
    ).run(req.user.org_id, ...Object.values(p)));
    touch(req.user.org_id);
    res.status(201).json({ product: shapeProduct(db.prepare(`SELECT ${PRODUCT_COLS} FROM products p WHERE p.id = ?`).get(r.lastInsertRowid)) });
  });

  app.patch('/api/supplier/products/:id', supplierOnly, (req, res) => {
    const id = v.int(req.params.id, 'id', { min: 1 });
    if (!db.prepare('SELECT 1 FROM products WHERE id = ? AND supplier_id = ?').get(id, req.user.org_id)) throw new HttpError(404, 'Product not found');
    const p = readProduct(req.body || {}, true);
    const cols = Object.keys(p);
    if (cols.length) {
      uniqueSku(() => db.prepare(`UPDATE products SET ${cols.map((c) => `${c} = ?`).join(', ')} WHERE id = ?`).run(...Object.values(p), id));
      touch(req.user.org_id);
    }
    res.json({ product: shapeProduct(db.prepare(`SELECT ${PRODUCT_COLS} FROM products p WHERE p.id = ?`).get(id)) });
  });

  /** Excel upload. The browser reads the sheet and sends its rows; dry_run previews. */
  app.post('/api/supplier/products/import', supplierOnly, (req, res) => {
    const b = req.body || {};
    res.json(runImport(db, req.user.org_id, b.rows, {
      hideMissing: !!b.hide_missing, dryRun: b.dry_run !== false, skipErrors: !!b.skip_errors,
      source: 'excel', fileName: v.str(b.file_name, 'file_name', { required: false, max: 200 }), actorId: req.user.id,
    }));
  });

  // ---------- terms of sale ----------

  app.get('/api/supplier/settings', supplierOnly, (req, res) => {
    const imports = db.prepare(`SELECT i.source, i.file_name, i.created, i.updated, i.unchanged, i.hidden, i.created_at, u.name AS actor_name
      FROM product_imports i LEFT JOIN users u ON u.id = i.actor_id WHERE i.org_id = ? ORDER BY i.id DESC LIMIT 10`).all(req.user.org_id);
    const keys = db.prepare('SELECT id, prefix, label, created_at, last_used_at FROM api_keys WHERE org_id = ? AND revoked_at IS NULL ORDER BY id DESC').all(req.user.org_id);
    res.json({ policy: getPolicy(db, req.user.org_id), imports, api_keys: keys });
  });

  app.put('/api/supplier/settings', supplierOnly, (req, res) => {
    const b = req.body || {};
    const p = {
      allow_full: b.allow_full ? 1 : 0,
      allow_partial: b.allow_partial ? 1 : 0,
      deposit_percent: v.int(b.deposit_percent ?? 30, 'deposit_percent', { min: 1, max: 99 }),
      allow_credit: b.allow_credit ? 1 : 0,
      credit_days: v.int(b.credit_days ?? 30, 'credit_days', { min: 1, max: 365 }),
      credit_limit: v.money(b.credit_limit ?? 0, 'credit_limit'),
      min_order_value: v.money(b.min_order_value ?? 0, 'min_order_value'),
      bank_details: v.str(b.bank_details, 'bank_details', { required: false, max: 500 }),
    };
    if (!p.allow_full && !p.allow_partial && !p.allow_credit) throw new HttpError(400, 'Choose at least one way pharmacies can pay');
    db.prepare(`UPDATE organizations SET ${Object.keys(p).map((k) => `${k} = ?`).join(', ')} WHERE id = ?`).run(...Object.values(p), req.user.org_id);
    res.json({ policy: getPolicy(db, req.user.org_id) });
  });

  // ---------- API access for the company's own system ----------

  app.post('/api/supplier/api-keys', supplierOnly, (req, res) => {
    const label = v.str(req.body?.label, 'label', { required: false, max: 80 });
    const key = generateApiKey();
    const r = db.prepare('INSERT INTO api_keys (org_id, prefix, key_hash, label) VALUES (?, ?, ?, ?)').run(req.user.org_id, key.slice(0, 10), hashApiKey(key), label);
    res.status(201).json({ id: Number(r.lastInsertRowid), key, prefix: key.slice(0, 10), label });
  });

  app.delete('/api/supplier/api-keys/:id', supplierOnly, (req, res) => {
    const r = db.prepare("UPDATE api_keys SET revoked_at = datetime('now') WHERE id = ? AND org_id = ? AND revoked_at IS NULL")
      .run(v.int(req.params.id, 'id', { min: 1 }), req.user.org_id);
    if (!r.changes) throw new HttpError(404, 'Key not found');
    res.json({ ok: true });
  });

  /**
   * Machine API: the company's ERP/stock system sends its product list.
   *   POST /api/v1/products/sync      header  X-Api-Key: maa_...
   *   { "products": [{ "sku", "name", "price", "stock", ... }], "hide_missing": false, "dry_run": false }
   */
  const apiKeyAuth = (req, _res, next) => {
    const key = (req.get && req.get('x-api-key')) || '';
    const row = key && db.prepare(`SELECT k.id, k.org_id, o.verified FROM api_keys k JOIN organizations o ON o.id = k.org_id
      WHERE k.key_hash = ? AND k.revoked_at IS NULL AND o.type = 'supplier'`).get(hashApiKey(key));
    if (!row) return next(new HttpError(401, 'Missing or invalid API key'));
    if (!row.verified) return next(new HttpError(403, 'Your organization is awaiting license verification'));
    db.prepare("UPDATE api_keys SET last_used_at = datetime('now') WHERE id = ?").run(row.id);
    req.apiOrgId = row.org_id;
    next();
  };

  app.post('/api/v1/products/sync', apiKeyAuth, (req, res) => {
    const b = req.body || {};
    res.json(runImport(db, req.apiOrgId, b.products, {
      hideMissing: !!b.hide_missing, dryRun: !!b.dry_run, skipErrors: !!b.skip_errors, source: 'api',
    }));
  });
};

module.exports.runImport = runImport;

},
"src/routes/orders": function (module, exports, require) {
'use strict';
const { HttpError, requireRole } = require('../http');
const { deliveryCode } = require('../auth');
const { tx } = require('../store');
const v = require('../validate');
const { getPolicy, creditOutstanding } = require('../policy');
const { TERMS, paymentOptions, collectOnDelivery } = require('../../shared/payment');

/**
 * Order lifecycle
 *
 *   placed ──accept──▶ accepted ──mark ready──▶ ready_for_pickup ──driver claims──▶ assigned
 *     │                   │                          ▲                               │
 *     ├─reject──▶ rejected│                          └────────driver releases────────┤
 *     └─cancel──▶ cancelled◀──cancel (supplier)                                      ▼
 *                                                          delivered ◀──code── picked_up
 *
 * Stock is reserved when the order is placed and returned on reject/cancel.
 * An order can only be marked ready once the company has recorded the upfront
 * payment its terms require (full: everything, partial: the deposit, credit: nothing).
 */
const PAYMENT_METHODS = ['bank_transfer', 'cash', 'card', 'cheque', 'other'];

const STATUS = {
  PLACED: 'placed', ACCEPTED: 'accepted', REJECTED: 'rejected', CANCELLED: 'cancelled',
  READY: 'ready_for_pickup', ASSIGNED: 'assigned', PICKED_UP: 'picked_up', DELIVERED: 'delivered',
};

function addEvent(db, orderId, status, actorId, note = null) {
  db.prepare('INSERT INTO order_events (order_id, status, note, actor_id) VALUES (?, ?, ?, ?)').run(orderId, status, note, actorId);
}

function setStatus(db, orderId, from, to, actorId, note, extra = {}) {
  const sets = ['status = ?', "updated_at = datetime('now')", ...Object.keys(extra).map((k) => `${k} = ?`)];
  const r = db.prepare(`UPDATE orders SET ${sets.join(', ')} WHERE id = ? AND status IN (${from.map(() => '?').join(',')})`)
    .run(to, ...Object.values(extra), orderId, ...from);
  if (r.changes !== 1) throw new HttpError(409, `Order cannot move to "${to}" from its current status`);
  addEvent(db, orderId, to, actorId, note);
}

function restock(db, orderId) {
  for (const it of db.prepare('SELECT product_id, qty FROM order_items WHERE order_id = ?').all(orderId)) {
    db.prepare('UPDATE products SET stock = stock + ? WHERE id = ?').run(it.qty, it.product_id);
  }
}

/** Full order view, filtered for what the viewer is allowed to see. */
function loadOrder(db, id, user) {
  const o = db.prepare(`
    SELECT o.*, ph.name AS pharmacy_name, ph.phone AS pharmacy_phone, ph.city AS pharmacy_city,
           su.name AS supplier_name, su.address AS supplier_address, su.phone AS supplier_phone, su.bank_details AS supplier_bank_details,
           su.deposit_percent AS supplier_deposit_percent,
           d.name AS driver_name, d.phone AS driver_phone, d.vehicle AS driver_vehicle
      FROM orders o
      JOIN organizations ph ON ph.id = o.pharmacy_id
      JOIN organizations su ON su.id = o.supplier_id
      LEFT JOIN users d ON d.id = o.driver_id
     WHERE o.id = ?`).get(id);
  if (!o) return null;
  const canSee =
    user.role === 'admin' ||
    (user.role === 'pharmacy' && o.pharmacy_id === user.org_id) ||
    (user.role === 'supplier' && o.supplier_id === user.org_id) ||
    (user.role === 'driver' && (o.driver_id === user.id || o.status === STATUS.READY));
  if (!canSee) return null;
  // Only the receiving pharmacy ever sees the handover code.
  if (!(user.role === 'pharmacy' || user.role === 'admin')) delete o.delivery_code;
  o.items = db.prepare('SELECT product_id, name, unit_price, qty, line_total FROM order_items WHERE order_id = ?').all(id);
  o.payments = user.role === 'driver' ? [] : db.prepare(`
    SELECT p.amount, p.method, p.reference, p.created_at, u.name AS recorded_by
      FROM order_payments p LEFT JOIN users u ON u.id = p.recorded_by WHERE p.order_id = ? ORDER BY p.id`).all(id);
  o.balance = o.total - o.paid_amount;
  o.collect_on_delivery = collectOnDelivery(o);
  o.events = db.prepare(`
    SELECT e.status, e.note, e.created_at, u.name AS actor_name, u.role AS actor_role
      FROM order_events e LEFT JOIN users u ON u.id = e.actor_id WHERE e.order_id = ? ORDER BY e.id`).all(id);
  return o;
}

function listOrders(db, user, statusFilter) {
  let where; let args;
  switch (user.role) {
    case 'pharmacy': where = 'o.pharmacy_id = ?'; args = [user.org_id]; break;
    case 'supplier': where = 'o.supplier_id = ?'; args = [user.org_id]; break;
    case 'driver': where = 'o.driver_id = ?'; args = [user.id]; break;
    default: where = '1 = 1'; args = [];
  }
  if (statusFilter) {
    const list = String(statusFilter).split(',').filter((s) => Object.values(STATUS).includes(s));
    if (list.length) { where += ` AND o.status IN (${list.map(() => '?').join(',')})`; args.push(...list); }
  }
  return db.prepare(`
    SELECT o.id, o.status, o.total, o.subtotal, o.delivery_fee, o.payment_terms, o.upfront_required, o.paid_amount, o.due_date, o.created_at, o.updated_at,
           o.delivery_address, ph.name AS pharmacy_name, su.name AS supplier_name, d.name AS driver_name,
           (SELECT COUNT(*) FROM order_items i WHERE i.order_id = o.id) AS item_count
      FROM orders o
      JOIN organizations ph ON ph.id = o.pharmacy_id
      JOIN organizations su ON su.id = o.supplier_id
      LEFT JOIN users d ON d.id = o.driver_id
     WHERE ${where} ORDER BY o.id DESC LIMIT 200`).all(...args);
}

module.exports = (app, { db, deliveryFee }) => {
  /**
   * Checkout. A cart can mix products from several companies; it is split
   * into one order per supplier, each delivered separately.
   */
  app.post('/api/orders', requireRole('pharmacy'), (req, res) => {
    const b = req.body || {};
    const supplierId = v.int(b.supplier_id, 'supplier_id', { min: 1 });
    if (!Array.isArray(b.items) || b.items.length === 0) throw new HttpError(400, 'items must be a non-empty list');
    if (b.items.length > 500) throw new HttpError(400, 'Too many items in one order');
    const terms = b.payment_terms;
    if (!TERMS.includes(terms)) throw new HttpError(400, 'payment_terms must be full, partial or credit');
    const notes = v.str(b.notes, 'notes', { required: false, max: 500 });
    const reference = v.str(b.payment_reference, 'payment_reference', { required: false, max: 100 });

    const supplier = db.prepare("SELECT * FROM organizations WHERE id = ? AND type = 'supplier' AND verified = 1").get(supplierId);
    if (!supplier) throw new HttpError(400, 'This company is not available');
    const policy = getPolicy(db, supplierId);

    // Merge duplicate lines.
    const qtyByProduct = new Map();
    for (const it of b.items) {
      const pid = v.int(it?.product_id, 'product_id', { min: 1 });
      const qty = v.int(it?.qty, 'qty', { min: 1, max: 100_000 });
      qtyByProduct.set(pid, (qtyByProduct.get(pid) || 0) + qty);
    }
    const pharmacy = db.prepare('SELECT * FROM organizations WHERE id = ?').get(req.user.org_id);

    const orderId = tx(db, () => {
      const lines = [];
      for (const [pid, qty] of qtyByProduct) {
        const p = db.prepare('SELECT * FROM products WHERE id = ? AND supplier_id = ? AND active = 1').get(pid, supplierId);
        if (!p) throw new HttpError(400, `Product ${pid} is not available`);
        if (qty < p.min_order_qty) throw new HttpError(400, `Minimum order for ${p.name} is ${p.min_order_qty}`);
        const upd = db.prepare('UPDATE products SET stock = stock - ? WHERE id = ? AND stock >= ?').run(qty, pid, qty);
        if (upd.changes !== 1) throw new HttpError(409, `Not enough stock for ${p.name} (available: ${p.stock})`);
        lines.push({ p, qty });
      }
      const subtotal = lines.reduce((s, l) => s + l.p.price * l.qty, 0);
      if (subtotal < policy.min_order_value) throw new HttpError(400, `Minimum order value for this company is ${policy.min_order_value}`, { code: 'min_order_value', value: policy.min_order_value });
      const total = subtotal + deliveryFee;

      // Payment terms must be offered by the company, and credit must fit within the limit.
      const option = paymentOptions(policy, total, creditOutstanding(db, pharmacy.id, supplierId)).find((x) => x.terms === terms);
      if (!option) throw new HttpError(400, 'This company does not offer that payment option');
      if (!option.available) throw new HttpError(409, 'This order is above your remaining credit with this company', { code: 'credit_limit', remaining: option.remaining });

      const r = db.prepare(`
        INSERT INTO orders (pharmacy_id, supplier_id, placed_by, status, subtotal, delivery_fee, total, payment_terms,
                            upfront_required, payment_reference, credit_days, notes, delivery_address, delivery_code)
        VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`).run(
        pharmacy.id, supplierId, req.user.id, STATUS.PLACED, subtotal, deliveryFee, total, terms,
        option.upfront, reference, terms === 'credit' ? policy.credit_days : null, notes,
        [pharmacy.address, pharmacy.city].filter(Boolean).join(', '), deliveryCode());
      const id = Number(r.lastInsertRowid);
      for (const { p, qty } of lines) {
        const label = [p.name, p.strength, p.form, p.pack_size].filter(Boolean).join(' · ');
        db.prepare('INSERT INTO order_items (order_id, product_id, name, unit_price, qty, line_total) VALUES (?, ?, ?, ?, ?, ?)')
          .run(id, p.id, label, p.price, qty, p.price * qty);
      }
      addEvent(db, id, STATUS.PLACED, req.user.id);
      return id;
    });

    res.status(201).json({ order: loadOrder(db, orderId, req.user) });
  });

  app.get('/api/orders', requireRole(), (req, res) => {
    res.json({ orders: listOrders(db, req.user, req.query.status) });
  });

  app.get('/api/orders/:id', requireRole(), (req, res) => {
    const o = loadOrder(db, v.int(req.params.id, 'id', { min: 1 }), req.user);
    if (!o) throw new HttpError(404, 'Order not found');
    res.json({ order: o });
  });

  // Fetch an order the current org owns (supplier or pharmacy side) or 404.
  const ownOrder = (req, side) => {
    const id = v.int(req.params.id, 'id', { min: 1 });
    const o = db.prepare(`SELECT * FROM orders WHERE id = ? AND ${side}_id = ?`).get(id, req.user.org_id);
    if (!o) throw new HttpError(404, 'Order not found');
    return o;
  };

  const respond = (req, res, id) => res.json({ order: loadOrder(db, id, req.user) });

  // ---------- Supplier actions ----------

  app.post('/api/orders/:id/accept', requireRole('supplier'), (req, res) => {
    const o = ownOrder(req, 'supplier');
    tx(db, () => setStatus(db, o.id, [STATUS.PLACED], STATUS.ACCEPTED, req.user.id, v.str(req.body?.note, 'note', { required: false, max: 300 })));
    respond(req, res, o.id);
  });

  app.post('/api/orders/:id/reject', requireRole('supplier'), (req, res) => {
    const o = ownOrder(req, 'supplier');
    const reason = v.str(req.body?.reason, 'reason', { max: 300 });
    tx(db, () => { setStatus(db, o.id, [STATUS.PLACED], STATUS.REJECTED, req.user.id, reason); restock(db, o.id); });
    respond(req, res, o.id);
  });

  app.post('/api/orders/:id/ready', requireRole('supplier'), (req, res) => {
    const o = ownOrder(req, 'supplier');
    if (o.paid_amount < o.upfront_required) {
      throw new HttpError(409, `Record the customer's payment first: ${o.paid_amount} of ${o.upfront_required} received`, { code: 'payment_required', paid: o.paid_amount, required: o.upfront_required });
    }
    tx(db, () => setStatus(db, o.id, [STATUS.ACCEPTED], STATUS.READY, req.user.id, 'Packed and waiting for a driver'));
    respond(req, res, o.id);
  });

  // ---------- Pharmacy / supplier cancel ----------

  app.post('/api/orders/:id/cancel', requireRole('pharmacy', 'supplier'), (req, res) => {
    const side = req.user.role;
    const o = ownOrder(req, side);
    // A pharmacy can cancel until the supplier accepts; a supplier until a driver claims it.
    const allowed = side === 'pharmacy' ? [STATUS.PLACED] : [STATUS.ACCEPTED, STATUS.READY];
    const reason = v.str(req.body?.reason, 'reason', { required: false, max: 300 });
    tx(db, () => { setStatus(db, o.id, allowed, STATUS.CANCELLED, req.user.id, reason); restock(db, o.id); });
    respond(req, res, o.id);
  });

  // ---------- Payments ----------

  /** The company records money it has actually received (transfer cleared, cash counted, ...). */
  app.post('/api/orders/:id/payments', requireRole('supplier'), (req, res) => {
    const o = ownOrder(req, 'supplier');
    if ([STATUS.REJECTED, STATUS.CANCELLED].includes(o.status)) throw new HttpError(409, 'This order is closed');
    const amount = v.money(req.body?.amount, 'amount');
    if (amount <= 0) throw new HttpError(400, 'amount must be more than zero');
    if (amount > o.total - o.paid_amount) throw new HttpError(400, `Payment is more than the amount still owed (${o.total - o.paid_amount})`, { code: 'overpayment', balance: o.total - o.paid_amount });
    const method = req.body?.method;
    if (!PAYMENT_METHODS.includes(method)) throw new HttpError(400, `method must be one of ${PAYMENT_METHODS.join(', ')}`);
    const reference = v.str(req.body?.reference, 'reference', { required: false, max: 100 });
    tx(db, () => {
      db.prepare('INSERT INTO order_payments (order_id, amount, method, reference, recorded_by) VALUES (?, ?, ?, ?, ?)').run(o.id, amount, method, reference, req.user.id);
      const r = db.prepare("UPDATE orders SET paid_amount = paid_amount + ?, updated_at = datetime('now') WHERE id = ? AND paid_amount + ? <= total").run(amount, o.id, amount);
      if (r.changes !== 1) throw new HttpError(409, 'The order changed. Refresh and try again.');
      addEvent(db, o.id, 'payment_received', req.user.id, String(amount));
    });
    respond(req, res, o.id);
  });

  /** The pharmacy adds the bank-transfer receipt number so the company can match the payment. */
  app.post('/api/orders/:id/payment-reference', requireRole('pharmacy'), (req, res) => {
    const o = ownOrder(req, 'pharmacy');
    const reference = v.str(req.body?.reference, 'reference', { max: 100 });
    tx(db, () => {
      db.prepare("UPDATE orders SET payment_reference = ?, updated_at = datetime('now') WHERE id = ?").run(reference, o.id);
      addEvent(db, o.id, 'payment_reference', req.user.id, reference);
    });
    respond(req, res, o.id);
  });
};

module.exports.STATUS = STATUS;
module.exports.setStatus = setStatus;
module.exports.loadOrder = loadOrder;

},
"src/routes/deliveries": function (module, exports, require) {
'use strict';
const { HttpError, requireRole } = require('../http');
const { tx } = require('../store');
const v = require('../validate');
const { STATUS, setStatus, loadOrder } = require('./orders');
const { collectOnDelivery } = require('../../shared/payment');

/** Driver side: pick up packed orders from suppliers and hand them to pharmacies. */
module.exports = (app, { db }) => {
  /** Jobs waiting for a driver, with pickup and drop-off info. */
  app.get('/api/deliveries/available', requireRole('driver'), (_req, res) => {
    const jobs = db.prepare(`
      SELECT o.id, o.total, o.delivery_fee, o.payment_terms, o.paid_amount, o.updated_at,
             su.name AS supplier_name, su.address AS pickup_address, su.city AS pickup_city,
             ph.name AS pharmacy_name, o.delivery_address,
             (SELECT COUNT(*) FROM order_items i WHERE i.order_id = o.id) AS item_count,
             (SELECT MAX(p.cold_chain) FROM order_items i JOIN products p ON p.id = i.product_id WHERE i.order_id = o.id) AS cold_chain
        FROM orders o
        JOIN organizations su ON su.id = o.supplier_id
        JOIN organizations ph ON ph.id = o.pharmacy_id
       WHERE o.status = ? ORDER BY o.updated_at`).all(STATUS.READY);
    res.json({ jobs: jobs.map((j) => ({ ...j, cold_chain: !!j.cold_chain, collect_on_delivery: collectOnDelivery(j) })) });
  });

  const id = (req) => v.int(req.params.id, 'id', { min: 1 });
  const mine = (req) => {
    const o = db.prepare('SELECT * FROM orders WHERE id = ? AND driver_id = ?').get(id(req), req.user.id);
    if (!o) throw new HttpError(404, 'Delivery not found');
    return o;
  };
  const respond = (req, res, orderId) => res.json({ order: loadOrder(db, orderId, req.user) });

  app.post('/api/deliveries/:id/claim', requireRole('driver'), (req, res) => {
    const orderId = id(req);
    // setStatus only matches rows still in ready_for_pickup, so two drivers can't claim the same job.
    tx(db, () => setStatus(db, orderId, [STATUS.READY], STATUS.ASSIGNED, req.user.id, `Driver ${req.user.name} assigned`, { driver_id: req.user.id }));
    respond(req, res, orderId);
  });

  app.post('/api/deliveries/:id/release', requireRole('driver'), (req, res) => {
    const o = mine(req);
    tx(db, () => setStatus(db, o.id, [STATUS.ASSIGNED], STATUS.READY, req.user.id, 'Driver released the job', { driver_id: null }));
    res.json({ ok: true });
  });

  app.post('/api/deliveries/:id/pickup', requireRole('driver'), (req, res) => {
    const o = mine(req);
    tx(db, () => setStatus(db, o.id, [STATUS.ASSIGNED], STATUS.PICKED_UP, req.user.id, 'Collected from supplier, on the way'));
    respond(req, res, o.id);
  });

  /** Proof of delivery: the pharmacy reads its 6-digit code to the driver. */
  app.post('/api/deliveries/:id/deliver', requireRole('driver'), (req, res) => {
    const o = mine(req);
    const code = v.str(req.body?.code, 'code', { max: 10 });
    if (o.status !== STATUS.PICKED_UP) throw new HttpError(409, 'Order has not been picked up yet');
    if (code !== o.delivery_code) throw new HttpError(400, 'Delivery code is incorrect');
    const note = v.str(req.body?.note, 'note', { required: false, max: 300 });
    // Credit terms start counting from the day the goods arrive.
    const extra = o.payment_terms === 'credit' ? { due_date: new Date(Date.now() + o.credit_days * 86_400_000).toISOString().slice(0, 10) } : {};
    tx(db, () => setStatus(db, o.id, [STATUS.PICKED_UP], STATUS.DELIVERED, req.user.id, note || 'Handed over to pharmacy', extra));
    respond(req, res, o.id);
  });
};

},

      .map((o) => ({ ...o, verified: !!o.verified }));

             COALESCE(SUM(CASE WHEN status = 'delivered' THEN total END), 0) AS delivered_value,

             SUM(status IN ('placed','accepted','ready_for_pickup','assigned','picked_up')) AS in_progress

  app.post('/api/admin/organizations/:id/verify', requireRole('admin'), (req, res) => {
